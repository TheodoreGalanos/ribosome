name: Check
on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
permissions:
  contents: read
jobs:
  local:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install Rust toolchain
        run: rustup show
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Check optional trajectory importer
        run: cargo test -p ribosome-import --features remote --locked
      - run: npm run test:installed
      - run: npm audit --omit=dev
