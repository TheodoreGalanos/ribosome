const pages = [{"slug":"index","title":"Introduction","description":"Inspect and repair agent work, retain project knowledge, and test reusable behavior.","group":"Start","html":"\u003ch1 id=\"ribosome\">Ribosome\u003c/h1>\n\u003cp>Ribosome adds maintenance agents to your workflows. They inspect results, investigate problems, help repair artifacts, and prepare useful procedures for reuse.\u003c/p>\n\u003cp>Use it during execution, at a handoff, or after a run. Your application keeps its agent loop, tools, and acceptance rules.\u003c/p>\n\u003ch2 id=\"start-here\">Start here\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>You want to…\u003c/th>\n\u003cth>Read\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>See a working example\u003c/td>\n\u003ctd>\u003ca href=\"#start/quickstart\">Quickstart\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Connect your own agent\u003c/td>\n\u003ctd>\u003ca href=\"#guides/connect\">Connect an agent\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Understand the design\u003c/td>\n\u003ctd>\u003ca href=\"#core/how-it-works\">How it works\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"what-it-does\">What it does\u003c/h2>\n\u003cp>\u003cstrong>Observe.\u003c/strong> Receive findings linked to the work that produced them.\u003c/p>\n\u003cp>\u003cstrong>Repair.\u003c/strong> Give a maintenance agent permission to change selected artifacts and run your checks.\u003c/p>\n\u003cp>\u003cstrong>Remember.\u003c/strong> Save project knowledge with its evidence and conditions for use. Retrieve it in later work and withdraw it when its sources change.\u003c/p>\n\u003cp>\u003cstrong>Learn and reuse.\u003c/strong> Investigate behavior in past runs, prepare executable instructions, and test them on fresh tasks. Compare the result with an ordinary agent, retries, critique, or caretaker help.\u003c/p>\n\u003ch2 id=\"get-the-library\">Get the library\u003c/h2>\n\u003cp>Ribosome is an early-stage local library built with TypeScript/Pi and Rust. Install it from source. Model calls use your configured provider.\u003c/p>\n\u003cp>Start with the \u003ca href=\"#start/quickstart\">quickstart\u003c/a>, then \u003ca href=\"#guides/connect\">connect your agent\u003c/a>. \u003ca href=\"#evaluation/support\">Current support\u003c/a> records what has been tested.\u003c/p>\n","text":"\n# Ribosome\n\nRibosome adds maintenance agents to your workflows. They inspect results, investigate problems, help repair artifacts, and prepare useful procedures for reuse.\n\nUse it during execution, at a handoff, or after a run. Your application keeps its agent loop, tools, and acceptance rules.\n\n## Start here\n\n| You want to… | Read |\n| --- | --- |\n| See a working example | [Quickstart](start/quickstart.md) |\n| Connect your own agent | [Connect an agent](guides/connect.md) |\n| Understand the design | [How it works](core/how-it-works.md) |\n\n## What it does\n\n**Observe.** Receive findings linked to the work that produced them.\n\n**Repair.** Give a maintenance agent permission to change selected artifacts and run your checks.\n\n**Remember.** Save project knowledge with its evidence and conditions for use. Retrieve it in later work and withdraw it when its sources change.\n\n**Learn and reuse.** Investigate behavior in past runs, prepare executable instructions, and test them on fresh tasks. Compare the result with an ordinary agent, retries, critique, or caretaker help.\n\n## Get the library\n\nRibosome is an early-stage local library built with TypeScript/Pi and Rust. Install it from source. Model calls use your configured provider.\n\nStart with the [quickstart](start/quickstart.md), then [connect your agent](guides/connect.md). [Current support](evaluation/support.md) records what has been tested.\n","headings":[{"level":"h2","id":"start-here","text":"Start here"},{"level":"h2","id":"what-it-does","text":"What it does"},{"level":"h2","id":"get-the-library","text":"Get the library"}],"source":"https://github.com/TheodoreGalanos/ribosome/blob/main/docs/content/index.md"},{"slug":"start/quickstart","title":"Quickstart","description":"Run Ribosome beside an agent and inspect a checked repair.","group":"Start","html":"\u003ch1 id=\"quickstart\">Quickstart\u003c/h1>\n\u003cp>Run the included example: find a unit error, repair the report, and let the original agent continue.\u003c/p>\n\u003ch2 id=\"build\">Build\u003c/h2>\n\u003cp>Use the Node and Rust versions pinned in the repository. You also need Git, npm, and the Rust build tools.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cdiv class=\"code-top\">\u003cspan>sh\u003c/span>\u003cbutton class=\"copy\" aria-label=\"Copy code\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode>git clone https://github.com/TheodoreGalanos/ribosome.git\ncd ribosome\nnpm ci --ignore-scripts\ncargo build --workspace --locked\nnpm run build\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>This builds both components. For the full automated suite, run \u003ccode>npm run check\u003c/code> separately.\u003c/p>\n\u003ch2 id=\"configure-a-provider\">Configure a provider\u003c/h2>\n\u003cp>Create \u003ccode>.env\u003c/code> in the repository root. For OpenAI:\u003c/p>\n\u003cdiv class=\"code-block\">\u003cdiv class=\"code-top\">\u003cspan>dotenv\u003c/span>\u003cbutton class=\"copy\" aria-label=\"Copy code\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode>RIBOSOME_PROVIDER=openai\nRIBOSOME_MODEL=your-model-id\nOPENAI_API_KEY=your-api-key\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>Replace the placeholders with your local settings. The model must exist in the pinned Pi catalogue. Keep \u003ccode>.env\u003c/code> private. See \u003ca href=\"#reference/configuration\">configuration\u003c/a> for provider options.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cdiv class=\"code-top\">\u003cspan>sh\u003c/span>\u003cbutton class=\"copy\" aria-label=\"Copy code\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode>npm run provider:check\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>This checks that the required settings are present. The demo makes the actual provider connection.\u003c/p>\n\u003ch2 id=\"run\">Run\u003c/h2>\n\u003cdiv class=\"code-block\">\u003cdiv class=\"code-top\">\u003cspan>sh\u003c/span>\u003cbutton class=\"copy\" aria-label=\"Copy code\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode>npm run demo:attached\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>\u003cstrong>This makes paid model calls.\u003c/strong> The example allocates US$0.40 to the source agent and US$0.60 to maintenance using local catalogue prices. Provider charges can differ.\u003c/p>\n\u003ch2 id=\"inspect-the-result\">Inspect the result\u003c/h2>\n\u003cp>The seeded report treats \u003cstrong>1 metre + 200 centimetres as 201 metres\u003c/strong>. A successful run produces a finding, applies a checked correction to \u003cstrong>3 metres\u003c/strong>, and preserves the source measurements and independent cost analysis.\u003c/p>\n\u003cp>The demo writes a run directory under \u003ccode>.ribosome/attached-startup-*\u003c/code>. Read its \u003ccode>result.json\u003c/code> for findings, action receipts, and usage, then inspect the corrected report and its check results.\u003c/p>\n\u003cp>To attach during execution instead:\u003c/p>\n\u003cdiv class=\"code-block\">\u003cdiv class=\"code-top\">\u003cspan>sh\u003c/span>\u003cbutton class=\"copy\" aria-label=\"Copy code\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode>npm run demo:attached -- --mid-run\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>Next: \u003ca href=\"#guides/connect\">Connect an agent\u003c/a>.\u003c/p>\n","text":"\n# Quickstart\n\nRun the included example: find a unit error, repair the report, and let the original agent continue.\n\n## Build\n\nUse the Node and Rust versions pinned in the repository. You also need Git, npm, and the Rust build tools.\n\n```sh\ngit clone https://github.com/TheodoreGalanos/ribosome.git\ncd ribosome\nnpm ci --ignore-scripts\ncargo build --workspace --locked\nnpm run build\n```\n\nThis builds both components. For the full automated suite, run `npm run check` separately.\n\n## Configure a provider\n\nCreate `.env` in the repository root. For OpenAI:\n\n```dotenv\nRIBOSOME_PROVIDER=openai\nRIBOSOME_MODEL=your-model-id\nOPENAI_API_KEY=your-api-key\n```\n\nReplace the placeholders with your local settings. The model must exist in the pinned Pi catalogue. Keep `.env` private. See [configuration](../reference/configuration.md) for provider options.\n\n```sh\nnpm run provider:check\n```\n\nThis checks that the required settings are present. The demo makes the actual provider connection.\n\n## Run\n\n```sh\nnpm run demo:attached\n```\n\n**This makes paid model calls.** The example allocates US$0.40 to the source agent and US$0.60 to maintenance using local catalogue prices. Provider charges can differ.\n\n## Inspect the result\n\nThe seeded report treats **1 metre + 200 centimetres as 201 metres**. A successful run produces a finding, applies a checked correction to **3 metres**, and preserves the source measurements and independent cost analysis.\n\nThe demo writes a run directory under `.ribosome/attached-startup-*`. Read its `result.json` for findings, action receipts, and usage, then inspect the corrected report and its check results.\n\nTo attach during execution instead:\n\n```sh\nnpm run demo:attached -- --mid-run\n```\n\nNext: [Connect an agent](../guides/connect.md).\n","headings":[{"level":"h2","id":"build","text":"Build"},{"level":"h2","id":"configure-a-provider","text":"Configure a provider"},{"level":"h2","id":"run","text":"Run"},{"level":"h2","id":"inspect-the-result","text":"Inspect the result"}],"source":"https://github.com/TheodoreGalanos/ribosome/blob/main/docs/content/start/quickstart.md"},{"slug":"start/installation","title":"Installation","description":"Build from source or install the current build into another project.","group":"Start","html":"\u003ch1 id=\"installation\">Installation\u003c/h1>\n\u003cp>Build the Rust executable and TypeScript package from this repository.\u003c/p>\n\u003ch2 id=\"source-checkout\">Source checkout\u003c/h2>\n\u003cdiv class=\"code-block\">\u003cdiv class=\"code-top\">\u003cspan>sh\u003c/span>\u003cbutton class=\"copy\" aria-label=\"Copy code\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode>git clone https://github.com/TheodoreGalanos/ribosome.git\ncd ribosome\nnpm ci --ignore-scripts\ncargo build --workspace --locked\nnpm run build\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>Use the versions in \u003ca href=\"https://github.com/TheodoreGalanos/ribosome/blob/main/.node-version\">\u003ccode>.node-version\u003c/code>\u003c/a> and \u003ca href=\"https://github.com/TheodoreGalanos/ribosome/blob/main/rust-toolchain.toml\">\u003ccode>rust-toolchain.toml\u003c/code>\u003c/a>. These commands build both components. \u003ccode>npm run check\u003c/code> runs the full automated suite when you need it.\u003c/p>\n\u003cp>Local state uses SQLite. Model calls go to your selected provider.\u003c/p>\n\u003ch2 id=\"install-into-another-project\">Install into another project\u003c/h2>\n\u003cp>From a built checkout, choose an existing absolute project directory:\u003c/p>\n\u003cdiv class=\"code-block\">\u003cdiv class=\"code-top\">\u003cspan>sh\u003c/span>\u003cbutton class=\"copy\" aria-label=\"Copy code\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode>CONSUMER=/absolute/path/to/your-project\n\ncargo install --path crates/ribosome-cli --locked --root &quot;$CONSUMER&quot;\nnpm pack --workspace @ribosome/agents --pack-destination &quot;$CONSUMER&quot;\nnpm install --prefix &quot;$CONSUMER&quot; &quot;$CONSUMER/ribosome-agents-0.1.0.tgz&quot;\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>The executable is \u003ccode>$CONSUMER/bin/ribosome\u003c/code>. In that project&#39;s host configuration, set \u003ccode>node\u003c/code> to its Node executable and \u003ccode>worker\u003c/code> to the installed worker entrypoint.\u003c/p>\n\u003cp>Resolve the worker from the consumer directory:\u003c/p>\n\u003cdiv class=\"code-block\">\u003cdiv class=\"code-top\">\u003cspan>sh\u003c/span>\u003cbutton class=\"copy\" aria-label=\"Copy code\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode>cd &quot;$CONSUMER&quot;\nnode --input-type=module -e \\\n  &#39;import { fileURLToPath } from &quot;node:url&quot;; console.log(fileURLToPath(import.meta.resolve(&quot;@ribosome/agents/worker&quot;)))&#39;\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>Use the resolved absolute worker path in the consumer&#39;s configuration.\u003c/p>\n\u003ch2 id=\"verify-the-installation-path\">Verify the installation path\u003c/h2>\n\u003cp>From the source checkout:\u003c/p>\n\u003cdiv class=\"code-block\">\u003cdiv class=\"code-top\">\u003cspan>sh\u003c/span>\u003cbutton class=\"copy\" aria-label=\"Copy code\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode>npm run test:installed\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>This creates a temporary consumer and exercises the installed packages with local provider fixtures. It makes no paid calls.\u003c/p>\n\u003cp>Next: \u003ca href=\"#reference/configuration\">Configuration\u003c/a> or \u003ca href=\"#start/quickstart\">Quickstart\u003c/a>.\u003c/p>\n","text":"\n# Installation\n\nBuild the Rust executable and TypeScript package from this repository.\n\n## Source checkout\n\n```sh\ngit clone https://github.com/TheodoreGalanos/ribosome.git\ncd ribosome\nnpm ci --ignore-scripts\ncargo build --workspace --locked\nnpm run build\n```\n\nUse the versions in [`.node-version`](../../../.node-version) and [`rust-toolchain.toml`](../../../rust-toolchain.toml). These commands build both components. `npm run check` runs the full automated suite when you need it.\n\nLocal state uses SQLite. Model calls go to your selected provider.\n\n## Install into another project\n\nFrom a built checkout, choose an existing absolute project directory:\n\n```sh\nCONSUMER=/absolute/path/to/your-project\n\ncargo install --path crates/ribosome-cli --locked --root \"$CONSUMER\"\nnpm pack --workspace @ribosome/agents --pack-destination \"$CONSUMER\"\nnpm install --prefix \"$CONSUMER\" \"$CONSUMER/ribosome-agents-0.1.0.tgz\"\n```\n\nThe executable is `$CONSUMER/bin/ribosome`. In that project's host configuration, set `node` to its Node executable and `worker` to the installed worker entrypoint.\n\nResolve the worker from the consumer directory:\n\n```sh\ncd \"$CONSUMER\"\nnode --input-type=module -e \\\n  'import { fileURLToPath } from \"node:url\"; console.log(fileURLToPath(import.meta.resolve(\"@ribosome/agents/worker\")))'\n```\n\nUse the resolved absolute worker path in the consumer's configuration.\n\n## Verify the installation path\n\nFrom the source checkout:\n\n```sh\nnpm run test:installed\n```\n\nThis creates a temporary consumer and exercises the installed packages with local provider fixtures. It makes no paid calls.\n\nNext: [Configuration](../reference/configuration.md) or [Quickstart](quickstart.md).\n","headings":[{"level":"h2","id":"source-checkout","text":"Source checkout"},{"level":"h2","id":"install-into-another-project","text":"Install into another project"},{"level":"h2","id":"verify-the-installation-path","text":"Verify the installation path"}],"source":"https://github.com/TheodoreGalanos/ribosome/blob/main/docs/content/start/installation.md"},{"slug":"core/how-it-works","title":"How it works","description":"Your agent does the task. Ribosome maintains the work around it.","group":"Core","html":"\u003ch1 id=\"how-it-works\">How it works\u003c/h1>\n\u003cp>Your application supplies observations, artifact access, and permission to act. Ribosome supplies maintenance agents that use them.\u003c/p>\n\u003ch2 id=\"the-cycle\">The cycle\u003c/h2>\n\u003cdiv class=\"code-block\">\u003cdiv class=\"code-top\">\u003cspan>text\u003c/span>\u003cbutton class=\"copy\" aria-label=\"Copy code\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode>Observe → investigate → propose or act → check → retain evidence\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>The agent can request more information, try a repair, inspect the result, and change its approach. It can also conclude that no intervention is needed.\u003c/p>\n\u003ch2 id=\"three-profiles\">Three profiles\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Profile\u003c/th>\n\u003cth>Job\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Caretaker\u003c/td>\n\u003ctd>Investigate problems and help repair current work.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Curator\u003c/td>\n\u003ctd>Describe useful behavior and consolidate project knowledge.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Experimenter\u003c/td>\n\u003ctd>Compare candidate procedures with a baseline.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Choose the profiles your workflow needs. A caretaker can request a curator&#39;s investigation when the grant permits follow-up work.\u003c/p>\n\u003ch2 id=\"who-controls-what\">Who controls what?\u003c/h2>\n\u003cp>\u003cstrong>Your application\u003c/strong> defines the task, permitted files and tools, and required checks. It decides whether to accept advice, allow steering, or coordinate a repair.\u003c/p>\n\u003cp>\u003cstrong>TypeScript and Pi\u003c/strong> run the maintenance agents. The agents interpret evidence and choose what to investigate or try.\u003c/p>\n\u003cp>\u003cstrong>Rust\u003c/strong> stores evidence in SQLite, schedules work, shares budgets between runs, and enforces tool permissions. It records tool outcomes and reconciles interrupted execution.\u003c/p>\n\u003cp>The Rust host supervises Node workers. They exchange JSON-RPC messages over stdin/stdout. \u003ca href=\"#guides/runtime\">Runtime and storage\u003c/a> explains what persists and how work continues after interruption.\u003c/p>\n\u003ch2 id=\"ways-to-use-it\">Ways to use it\u003c/h2>\n\u003cp>Attach to an existing workflow for ongoing observations and feedback. Request a repair at an application-controlled boundary. Or run a curator over retained evidence after the task ends.\u003c/p>\n\u003cp>Pi is the included connector. Other harnesses send events and receive feedback through the generic interface while keeping their own agent loop.\u003c/p>\n\u003cp>Next: \u003ca href=\"#guides/connect\">Connect an agent\u003c/a>. For the design&#39;s origin, read \u003ca href=\"#core/inspiration\">Biological inspiration\u003c/a>.\u003c/p>\n","text":"\n# How it works\n\nYour application supplies observations, artifact access, and permission to act. Ribosome supplies maintenance agents that use them.\n\n## The cycle\n\n```text\nObserve → investigate → propose or act → check → retain evidence\n```\n\nThe agent can request more information, try a repair, inspect the result, and change its approach. It can also conclude that no intervention is needed.\n\n## Three profiles\n\n| Profile | Job |\n| --- | --- |\n| Caretaker | Investigate problems and help repair current work. |\n| Curator | Describe useful behavior and consolidate project knowledge. |\n| Experimenter | Compare candidate procedures with a baseline. |\n\nChoose the profiles your workflow needs. A caretaker can request a curator's investigation when the grant permits follow-up work.\n\n## Who controls what?\n\n**Your application** defines the task, permitted files and tools, and required checks. It decides whether to accept advice, allow steering, or coordinate a repair.\n\n**TypeScript and Pi** run the maintenance agents. The agents interpret evidence and choose what to investigate or try.\n\n**Rust** stores evidence in SQLite, schedules work, shares budgets between runs, and enforces tool permissions. It records tool outcomes and reconciles interrupted execution.\n\nThe Rust host supervises Node workers. They exchange JSON-RPC messages over stdin/stdout. [Runtime and storage](../guides/runtime.md) explains what persists and how work continues after interruption.\n\n## Ways to use it\n\nAttach to an existing workflow for ongoing observations and feedback. Request a repair at an application-controlled boundary. Or run a curator over retained evidence after the task ends.\n\nPi is the included connector. Other harnesses send events and receive feedback through the generic interface while keeping their own agent loop.\n\nNext: [Connect an agent](../guides/connect.md). For the design's origin, read [Biological inspiration](inspiration.md).\n","headings":[{"level":"h2","id":"the-cycle","text":"The cycle"},{"level":"h2","id":"three-profiles","text":"Three profiles"},{"level":"h2","id":"who-controls-what","text":"Who controls what?"},{"level":"h2","id":"ways-to-use-it","text":"Ways to use it"}],"source":"https://github.com/TheodoreGalanos/ribosome/blob/main/docs/content/core/how-it-works.md"},{"slug":"core/inspiration","title":"Biological inspiration","description":"The ideas behind proofreading, repair, and reuse in Ribosome.","group":"Core","html":"\u003ch1 id=\"biological-inspiration\">Biological inspiration\u003c/h1>\n\u003cp>A \u003ca href=\"https://www.genome.gov/genetics-glossary/Ribosome\">ribosome\u003c/a> reads messenger RNA and assembles a protein. Ribosome the library borrows more broadly from biological expression, repair, and adaptation.\u003c/p>\n\u003ch2 id=\"the-useful-analogy\">The useful analogy\u003c/h2>\n\u003cp>An execution trace records behavior in one situation: the inputs, decisions, actions, and observed results.\u003c/p>\n\u003cp>A reusable procedure can be drawn from that experience, but it needs testing before we rely on it elsewhere.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Inspiration\u003c/th>\n\u003cth>In Ribosome\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Proofreading\u003c/td>\n\u003ctd>Investigate a transition before its result is relied on.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Excision repair\u003c/td>\n\u003ctd>Replace affected work and check the result.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Recombination\u003c/td>\n\u003ctd>Adapt a prepared procedure to a new task.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Chaperoning\u003c/td>\n\u003ctd>Help an artifact meet its consumer&#39;s requirements.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Regulation\u003c/td>\n\u003ctd>Adjust a strategy to current conditions.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Immune memory\u003c/td>\n\u003ctd>Retain evidence about recurring failures and useful responses.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Regeneration\u003c/td>\n\u003ctd>Restore support for a result after its inputs change.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Maintenance profiles use these capabilities as part of their work.\u003c/p>\n\u003ch2 id=\"other-roots\">Other roots\u003c/h2>\n\u003cp>The design grew out of agent evaluation and evolution work in \u003ca href=\"https://github.com/TheodoreGalanos/aec-bench\">AEC-Bench\u003c/a>. Ribosome runs independently of it.\u003c/p>\n\u003cp>Its inventory also draws on \u003ca href=\"https://arxiv.org/abs/1504.04909\">MAP-Elites\u003c/a>: retain useful alternatives for different conditions. Ribosome&#39;s archive keeps evaluated implementations with the evidence and conditions that support each choice.\u003c/p>\n\u003cp>Next: \u003ca href=\"#core/motifs\">Behavioral motifs\u003c/a>.\u003c/p>\n","text":"\n# Biological inspiration\n\nA [ribosome](https://www.genome.gov/genetics-glossary/Ribosome) reads messenger RNA and assembles a protein. Ribosome the library borrows more broadly from biological expression, repair, and adaptation.\n\n## The useful analogy\n\nAn execution trace records behavior in one situation: the inputs, decisions, actions, and observed results.\n\nA reusable procedure can be drawn from that experience, but it needs testing before we rely on it elsewhere.\n\n| Inspiration | In Ribosome |\n| --- | --- |\n| Proofreading | Investigate a transition before its result is relied on. |\n| Excision repair | Replace affected work and check the result. |\n| Recombination | Adapt a prepared procedure to a new task. |\n| Chaperoning | Help an artifact meet its consumer's requirements. |\n| Regulation | Adjust a strategy to current conditions. |\n| Immune memory | Retain evidence about recurring failures and useful responses. |\n| Regeneration | Restore support for a result after its inputs change. |\n\nMaintenance profiles use these capabilities as part of their work.\n\n## Other roots\n\nThe design grew out of agent evaluation and evolution work in [AEC-Bench](https://github.com/TheodoreGalanos/aec-bench). Ribosome runs independently of it.\n\nIts inventory also draws on [MAP-Elites](https://arxiv.org/abs/1504.04909): retain useful alternatives for different conditions. Ribosome's archive keeps evaluated implementations with the evidence and conditions that support each choice.\n\nNext: [Behavioral motifs](motifs.md).\n","headings":[{"level":"h2","id":"the-useful-analogy","text":"The useful analogy"},{"level":"h2","id":"other-roots","text":"Other roots"}],"source":"https://github.com/TheodoreGalanos/ribosome/blob/main/docs/content/core/inspiration.md"},{"slug":"core/motifs","title":"Behavioral motifs","description":"Separate a pattern, an occurrence, and a reusable implementation.","group":"Core","html":"\u003ch1 id=\"behavioral-motifs\">Behavioral motifs\u003c/h1>\n\u003cp>A behavioral motif describes a useful function in an agent&#39;s work, such as checking an artifact before handoff. It is more specific than a label like “verification,” but need not prescribe every tool call.\u003c/p>\n\u003ch2 id=\"three-separate-records\">Three separate records\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Record\u003c/th>\n\u003cth>Question\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Definition\u003c/td>\n\u003ctd>What behavior are we describing?\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Occurrence\u003c/td>\n\u003ctd>Where did it appear, and what evidence supports that interpretation?\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Implementation\u003c/td>\n\u003ctd>What instructions or procedure could produce it again?\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>A separate admission record states the context in which an implementation has been accepted for reuse.\u003c/p>\n\u003ch2 id=\"say-what-was-discovered\">Say what was discovered\u003c/h2>\n\u003cp>An execution can support several useful kinds of knowledge:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Kind\u003c/th>\n\u003cth>Supporting evidence\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Agent strategy\u003c/td>\n\u003ctd>A decision between available options, the chosen action, and a subsequent observation or check.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Domain procedure\u003c/td>\n\u003ctd>An algorithm or procedure described in a file the agent inspected, such as a project&#39;s path-resolution rules.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Artifact requirement\u003c/td>\n\u003ctd>A condition the result must satisfy, such as preserving an independent field.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>State the kind in the definition&#39;s intent and the investigation&#39;s claims. To describe an agent strategy, identify the execution events that demonstrate it. A procedure found in source code can be useful to extract; its presence in a file establishes what that code describes. The agent&#39;s use of it needs its own evidence.\u003c/p>\n\u003cp>Chronological order is recorded in event sequences. Imported tool results link to their identified calls. A proposed relationship between otherwise adjacent messages remains an inference.\u003c/p>\n\u003ch2 id=\"example-check-before-handoff\">Example: check before handoff\u003c/h2>\n\u003cp>A worker produces a report, runs a check, and sends it to a planner.\u003c/p>\n\u003cp>The definition describes checking the artifact that will actually be handed off. The occurrence identifies the worker&#39;s actions, the check result, and the report version. The implementation describes how to repeat that behavior.\u003c/p>\n\u003cp>A later edit may make the earlier check insufficient. The maintenance agent needs to investigate what changed; the mere presence of a check does not settle the question.\u003c/p>\n\u003ch2 id=\"keep-local-results-in-context\">Keep local results in context\u003c/h2>\n\u003cp>A failed task can contain a useful procedure. A successful task can contain an unnecessary step.\u003c/p>\n\u003cp>Recognition and outcome are recorded separately. An obligation can also remain open or unknown while the task is still underway.\u003c/p>\n\u003ch2 id=\"discover-and-prepare-behavior\">Discover and prepare behavior\u003c/h2>\n\u003cp>Curators inspect selected execution evidence, search nearby events, and compare examples. A definition describes the conditions, required observations, and expected result of a behavior. An occurrence ties that interpretation to retrieved evidence, including events across producers.\u003c/p>\n\u003cp>A curator can save an inconclusive investigation when the evidence is insufficient. When a candidate is ready, extraction produces an implementation. Ribosome can execute prepared instructions through Pi with task-specific bindings, or invoke a host-registered procedure.\u003c/p>\n\u003cp>Extraction should preserve the useful procedure: observations to acquire, distinctions to make, actions those distinctions support, and checks on the result. Read the instruction as a recipient: what can you now do beyond the task description? Test that procedure with a nearby case requiring a different action or no change, and retain any missing steps as open questions.\u003c/p>\n\u003cp>Start with \u003ca href=\"#guides/discovery\">Discover a behavior\u003c/a>, then \u003ca href=\"#guides/reuse\">Reuse a procedure\u003c/a>. \u003ca href=\"#evaluation/support\">Current support\u003c/a> describes the observed learning trials.\u003c/p>\n","text":"\n# Behavioral motifs\n\nA behavioral motif describes a useful function in an agent's work, such as checking an artifact before handoff. It is more specific than a label like “verification,” but need not prescribe every tool call.\n\n## Three separate records\n\n| Record | Question |\n| --- | --- |\n| Definition | What behavior are we describing? |\n| Occurrence | Where did it appear, and what evidence supports that interpretation? |\n| Implementation | What instructions or procedure could produce it again? |\n\nA separate admission record states the context in which an implementation has been accepted for reuse.\n\n## Say what was discovered\n\nAn execution can support several useful kinds of knowledge:\n\n| Kind | Supporting evidence |\n| --- | --- |\n| Agent strategy | A decision between available options, the chosen action, and a subsequent observation or check. |\n| Domain procedure | An algorithm or procedure described in a file the agent inspected, such as a project's path-resolution rules. |\n| Artifact requirement | A condition the result must satisfy, such as preserving an independent field. |\n\nState the kind in the definition's intent and the investigation's claims. To describe an agent strategy, identify the execution events that demonstrate it. A procedure found in source code can be useful to extract; its presence in a file establishes what that code describes. The agent's use of it needs its own evidence.\n\nChronological order is recorded in event sequences. Imported tool results link to their identified calls. A proposed relationship between otherwise adjacent messages remains an inference.\n\n## Example: check before handoff\n\nA worker produces a report, runs a check, and sends it to a planner.\n\nThe definition describes checking the artifact that will actually be handed off. The occurrence identifies the worker's actions, the check result, and the report version. The implementation describes how to repeat that behavior.\n\nA later edit may make the earlier check insufficient. The maintenance agent needs to investigate what changed; the mere presence of a check does not settle the question.\n\n## Keep local results in context\n\nA failed task can contain a useful procedure. A successful task can contain an unnecessary step.\n\nRecognition and outcome are recorded separately. An obligation can also remain open or unknown while the task is still underway.\n\n## Discover and prepare behavior\n\nCurators inspect selected execution evidence, search nearby events, and compare examples. A definition describes the conditions, required observations, and expected result of a behavior. An occurrence ties that interpretation to retrieved evidence, including events across producers.\n\nA curator can save an inconclusive investigation when the evidence is insufficient. When a candidate is ready, extraction produces an implementation. Ribosome can execute prepared instructions through Pi with task-specific bindings, or invoke a host-registered procedure.\n\nExtraction should preserve the useful procedure: observations to acquire, distinctions to make, actions those distinctions support, and checks on the result. Read the instruction as a recipient: what can you now do beyond the task description? Test that procedure with a nearby case requiring a different action or no change, and retain any missing steps as open questions.\n\nStart with [Discover a behavior](../guides/discovery.md), then [Reuse a procedure](../guides/reuse.md). [Current support](../evaluation/support.md) describes the observed learning trials.\n","headings":[{"level":"h2","id":"three-separate-records","text":"Three separate records"},{"level":"h2","id":"say-what-was-discovered","text":"Say what was discovered"},{"level":"h2","id":"example-check-before-handoff","text":"Example: check before handoff"},{"level":"h2","id":"keep-local-results-in-context","text":"Keep local results in context"},{"level":"h2","id":"discover-and-prepare-behavior","text":"Discover and prepare behavior"}],"source":"https://github.com/TheodoreGalanos/ribosome/blob/main/docs/content/core/motifs.md"},{"slug":"guides/connect","title":"Connect an agent","description":"Send execution events and receive findings alongside your agent.","group":"Guides","html":"\u003ch1 id=\"connect-an-agent\">Connect an agent\u003c/h1>\n\u003cp>Attach Ribosome before execution or while an agent is running. Your application keeps its own loop and starts a separate host for maintenance. Begin with observations and feedback, then enable steering or cooperative repair where useful.\u003c/p>\n\u003ch2 id=\"connect-pi\">Connect Pi\u003c/h2>\n\u003cp>Install the packages and prepare a \u003ca href=\"#reference/configuration\">host configuration\u003c/a>. In this example, \u003ccode>agent\u003c/code> and \u003ccode>task\u003c/code> already belong to your application.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cdiv class=\"code-top\">\u003cspan>ts\u003c/span>\u003cbutton class=\"copy\" aria-label=\"Copy code\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode>import { AttachmentClient } from &#39;@ribosome/agents/attachments&#39;;\nimport { attachPi } from &#39;@ribosome/agents/attachments/pi&#39;;\n\nconst client = await AttachmentClient.start({\n  executable: &#39;/absolute/path/to/ribosome&#39;,\n  config: &#39;/absolute/path/to/host.json&#39;,\n});\n\ntry {\n  const attachment = await attachPi(client, agent, {\n    executionId: task.id,\n    onFeedback: feedback =&gt; console.log(feedback),\n    onError: error =&gt; console.error(&#39;Observation failed:&#39;, error),\n  });\n\n  await agent.prompt(task.prompt);\n  await attachment.finish();\n} finally {\n  await client.close();\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>Feedback contains record references. Use \u003ccode>attachment.readRecord(id)\u003c/code> to inspect a finding and its evidence. Your application decides how to present or act on it.\u003c/p>\n\u003ch2 id=\"supply-relevant-evidence\">Supply relevant evidence\u003c/h2>\n\u003cp>The Pi connector captures lifecycle and tool boundaries by default. Enable \u003ccode>captureMessages\u003c/code> or \u003ccode>captureToolContent\u003c/code> to include content, and use \u003ccode>redact(event)\u003c/code> to remove sensitive fields before persistence.\u003c/p>\n\u003cp>Configure the artifact paths and tools maintenance may use. An optional \u003ccode>artifacts(event)\u003c/code> callback supplies observed artifact versions, connecting an event to the files it affected.\u003c/p>\n\u003cp>Mid-run attachment observes events from subscription onward and records that coverage. Import earlier events explicitly if they matter. \u003ccode>start: &#39;history&#39;\u003c/code> includes history already supplied to Ribosome.\u003c/p>\n\u003ch2 id=\"other-harnesses\">Other harnesses\u003c/h2>\n\u003cp>Use \u003ccode>client.attach(...)\u003c/code> with \u003ccode>source.subscribe\u003c/code>, or call \u003ccode>attachment.publish(event)\u003c/code> from your existing loop:\u003c/p>\n\u003cdiv class=\"code-block\">\u003cdiv class=\"code-top\">\u003cspan>ts\u003c/span>\u003cbutton class=\"copy\" aria-label=\"Copy code\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode>const attachment = await client.attach({\n  executionId: task.id,\n  connector: &#39;my-harness&#39;,\n  connectorVersion: &#39;1&#39;,\n  onFeedback: feedback =&gt; console.log(feedback),\n});\n\nawait attachment.publish({\n  id: &#39;tool-result-17&#39;, producer: &#39;worker-session-1&#39;, sequence: &#39;1&#39;,\n  kind: &#39;tool.completed&#39;, timestamp_ms: String(Date.now()),\n  parents: [], correlation: &#39;tool-call-17&#39;, artifacts: [],\n  payload: { tool: &#39;inspect_report&#39;, is_error: false },\n});\nawait attachment.finish();\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>Use stable event IDs when retrying, increasing sequence numbers per producer, and correlation IDs that connect tool starts and results. Await persistence so the application can detect capture failures.\u003c/p>\n\u003ch2 id=\"communication-in-practice\">Communication in practice\u003c/h2>\n\u003cp>Configure \u003ccode>attachment.event_kinds\u003c/code>, \u003ccode>batch_size\u003c/code>, and \u003ccode>max_delay_ms\u003c/code> to control maintenance batches. Keep feedback handlers short and handle repeat delivery by feedback ID. Fetch the referenced findings, then present advice or queue steering at the source agent&#39;s next boundary.\u003c/p>\n\u003cp>Keep returned advice separate from source activity so it cannot repeatedly trigger itself. Treat observations as task data; permissions come from the host grant. Call \u003ccode>finish()\u003c/code> after the source turn to flush observations and await feedback, then \u003ccode>client.close()\u003c/code> when the host is no longer needed.\u003c/p>\n\u003cp>See the \u003ca href=\"https://github.com/TheodoreGalanos/ribosome/blob/main/docs/attachments.md\">connector reference\u003c/a> for event contracts, steering, and reconnect handling. Next: \u003ca href=\"#guides/runtime\">Runtime and storage\u003c/a> or \u003ca href=\"#guides/repair\">Repair an artifact\u003c/a>.\u003c/p>\n","text":"\n# Connect an agent\n\nAttach Ribosome before execution or while an agent is running. Your application keeps its own loop and starts a separate host for maintenance. Begin with observations and feedback, then enable steering or cooperative repair where useful.\n\n## Connect Pi\n\nInstall the packages and prepare a [host configuration](../reference/configuration.md). In this example, `agent` and `task` already belong to your application.\n\n```ts\nimport { AttachmentClient } from '@ribosome/agents/attachments';\nimport { attachPi } from '@ribosome/agents/attachments/pi';\n\nconst client = await AttachmentClient.start({\n  executable: '/absolute/path/to/ribosome',\n  config: '/absolute/path/to/host.json',\n});\n\ntry {\n  const attachment = await attachPi(client, agent, {\n    executionId: task.id,\n    onFeedback: feedback => console.log(feedback),\n    onError: error => console.error('Observation failed:', error),\n  });\n\n  await agent.prompt(task.prompt);\n  await attachment.finish();\n} finally {\n  await client.close();\n}\n```\n\nFeedback contains record references. Use `attachment.readRecord(id)` to inspect a finding and its evidence. Your application decides how to present or act on it.\n\n## Supply relevant evidence\n\nThe Pi connector captures lifecycle and tool boundaries by default. Enable `captureMessages` or `captureToolContent` to include content, and use `redact(event)` to remove sensitive fields before persistence.\n\nConfigure the artifact paths and tools maintenance may use. An optional `artifacts(event)` callback supplies observed artifact versions, connecting an event to the files it affected.\n\nMid-run attachment observes events from subscription onward and records that coverage. Import earlier events explicitly if they matter. `start: 'history'` includes history already supplied to Ribosome.\n\n## Other harnesses\n\nUse `client.attach(...)` with `source.subscribe`, or call `attachment.publish(event)` from your existing loop:\n\n```ts\nconst attachment = await client.attach({\n  executionId: task.id,\n  connector: 'my-harness',\n  connectorVersion: '1',\n  onFeedback: feedback => console.log(feedback),\n});\n\nawait attachment.publish({\n  id: 'tool-result-17', producer: 'worker-session-1', sequence: '1',\n  kind: 'tool.completed', timestamp_ms: String(Date.now()),\n  parents: [], correlation: 'tool-call-17', artifacts: [],\n  payload: { tool: 'inspect_report', is_error: false },\n});\nawait attachment.finish();\n```\n\nUse stable event IDs when retrying, increasing sequence numbers per producer, and correlation IDs that connect tool starts and results. Await persistence so the application can detect capture failures.\n\n## Communication in practice\n\nConfigure `attachment.event_kinds`, `batch_size`, and `max_delay_ms` to control maintenance batches. Keep feedback handlers short and handle repeat delivery by feedback ID. Fetch the referenced findings, then present advice or queue steering at the source agent's next boundary.\n\nKeep returned advice separate from source activity so it cannot repeatedly trigger itself. Treat observations as task data; permissions come from the host grant. Call `finish()` after the source turn to flush observations and await feedback, then `client.close()` when the host is no longer needed.\n\nSee the [connector reference](../../attachments.md) for event contracts, steering, and reconnect handling. Next: [Runtime and storage](runtime.md) or [Repair an artifact](repair.md).\n","headings":[{"level":"h2","id":"connect-pi","text":"Connect Pi"},{"level":"h2","id":"supply-relevant-evidence","text":"Supply relevant evidence"},{"level":"h2","id":"other-harnesses","text":"Other harnesses"},{"level":"h2","id":"communication-in-practice","text":"Communication in practice"}],"source":"https://github.com/TheodoreGalanos/ribosome/blob/main/docs/content/guides/connect.md"},{"slug":"guides/runtime","title":"Runtime and storage","description":"Start maintenance, share a budget, and resume work from local state.","group":"Guides","html":"\u003ch1 id=\"runtime-and-storage\">Runtime and storage\u003c/h1>\n\u003cp>Your application starts Ribosome when it needs maintenance. The Rust host runs Pi workers, schedules follow-up work, and saves progress locally.\u003c/p>\n\u003ch2 id=\"choose-how-work-starts\">Choose how work starts\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Trigger\u003c/th>\n\u003cth>How it works\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>An application request\u003c/td>\n\u003ctd>Start a run with a profile, operator, prompt, and grant. Use \u003ccode>ribosome run CONFIG.json\u003c/code> or the Rust \u003ccode>Supervisor\u003c/code>.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Attached execution events\u003c/td>\n\u003ctd>A configured subscription batches matching events and queues maintenance. The attachment client handles polling and feedback.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>An agent&#39;s request\u003c/td>\n\u003ctd>An active maintenance agent can ask for permitted follow-up work, such as a curator investigation.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>A host-owned experiment\u003c/td>\n\u003ctd>Use \u003ccode>ribosome study CONFIG.json EXPERIMENT_ID\u003c/code> to execute a prepared study directly.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>The host chooses when work becomes eligible. Once running, the maintenance agent reasons about what to read, investigate, or try. For a custom Rust integration, register a \u003ccode>Subscription\u003c/code> and call \u003ccode>Store::poll_subscription\u003c/code> from your event loop. Its event kinds, batch size, and maximum delay control when it queues work.\u003c/p>\n\u003cp>Discovery, extraction, evaluation, and later reuse are steps your application can connect. Start a separate run for each step that needs different evidence or permissions.\u003c/p>\n\u003ch2 id=\"run-beside-another-agent\">Run beside another agent\u003c/h2>\n\u003cp>An \u003ca href=\"#guides/connect\">attachment\u003c/a> sends observations to a separate Rust host while the source agent continues its own task. Event capture and persistence happen at the connector boundary; maintenance reasoning runs outside that callback.\u003c/p>\n\u003cp>Configure the events worth investigating and return findings through \u003ccode>onFeedback\u003c/code>. Deliver steering at an agent boundary. For shared-file repair, use the \u003ca href=\"#guides/repair\">writer handoff\u003c/a> so maintenance can check and apply changes while other writes are paused.\u003c/p>\n\u003ch2 id=\"where-work-is-saved\">Where work is saved\u003c/h2>\n\u003cp>\u003ccode>workspace\u003c/code> names the task directory. \u003ccode>state_dir\u003c/code> names Ribosome&#39;s state directory; the initializer places it at \u003ccode>workspace/.ribosome\u003c/code>.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cdiv class=\"code-top\">\u003cspan>text\u003c/span>\u003cbutton class=\"copy\" aria-label=\"Copy code\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode>workspace/\n  task files\n  .ribosome/              ← default state_dir\n    ribosome.db           ← SQLite records and runtime state\n    branches/             ← working copies for maintenance\n    exports/              ← managed exported artifacts\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>The database holds events, findings, memory, implementations, experiments, run status, continuation state, queued work, effect receipts, and usage. The TypeScript client keeps the active connection and callbacks. Reopening the database restores the saved work available to an authorized run.\u003c/p>\n\u003ch2 id=\"share-resources-between-runs\">Share resources between runs\u003c/h2>\n\u003cp>A grant sets the permitted tools, files, profiles, deadline, and budget. Parent runs, children, context compaction, and metered evaluations draw from a shared allowance. Each child or case can also have its own ceiling.\u003c/p>\n\u003cp>A parent waiting for child work saves its continuation and releases its worker slot. The child can run even with one worker slot available. Evidence reads, status, and accounting use short state operations while commands execute separately.\u003c/p>\n\u003cp>Attachment usage reports Ribosome&#39;s grant usage. To include the source agent in the same measured budget, its host transport must participate in the accounting interface. See \u003ca href=\"https://github.com/TheodoreGalanos/ribosome/blob/main/docs/protocol.md#shared-resource-accounting\">shared resource accounting\u003c/a>.\u003c/p>\n\u003ch2 id=\"continue-after-interruption\">Continue after interruption\u003c/h2>\n\u003cp>Repeat an interrupted run with its unchanged configuration and a valid grant. Ribosome restores its continuation, checks that its sources remain available, and reconciles recorded effects before proceeding.\u003c/p>\n\u003cp>An observed action result can complete its pending bookkeeping without executing the action again. An action with an unknown outcome needs owner inspection and settlement. \u003ca href=\"#reference/operations\">Operations\u003c/a> gives the commands and recovery steps.\u003c/p>\n","text":"\n# Runtime and storage\n\nYour application starts Ribosome when it needs maintenance. The Rust host runs Pi workers, schedules follow-up work, and saves progress locally.\n\n## Choose how work starts\n\n| Trigger | How it works |\n| --- | --- |\n| An application request | Start a run with a profile, operator, prompt, and grant. Use `ribosome run CONFIG.json` or the Rust `Supervisor`. |\n| Attached execution events | A configured subscription batches matching events and queues maintenance. The attachment client handles polling and feedback. |\n| An agent's request | An active maintenance agent can ask for permitted follow-up work, such as a curator investigation. |\n| A host-owned experiment | Use `ribosome study CONFIG.json EXPERIMENT_ID` to execute a prepared study directly. |\n\nThe host chooses when work becomes eligible. Once running, the maintenance agent reasons about what to read, investigate, or try. For a custom Rust integration, register a `Subscription` and call `Store::poll_subscription` from your event loop. Its event kinds, batch size, and maximum delay control when it queues work.\n\nDiscovery, extraction, evaluation, and later reuse are steps your application can connect. Start a separate run for each step that needs different evidence or permissions.\n\n## Run beside another agent\n\nAn [attachment](connect.md) sends observations to a separate Rust host while the source agent continues its own task. Event capture and persistence happen at the connector boundary; maintenance reasoning runs outside that callback.\n\nConfigure the events worth investigating and return findings through `onFeedback`. Deliver steering at an agent boundary. For shared-file repair, use the [writer handoff](repair.md) so maintenance can check and apply changes while other writes are paused.\n\n## Where work is saved\n\n`workspace` names the task directory. `state_dir` names Ribosome's state directory; the initializer places it at `workspace/.ribosome`.\n\n```text\nworkspace/\n  task files\n  .ribosome/              ← default state_dir\n    ribosome.db           ← SQLite records and runtime state\n    branches/             ← working copies for maintenance\n    exports/              ← managed exported artifacts\n```\n\nThe database holds events, findings, memory, implementations, experiments, run status, continuation state, queued work, effect receipts, and usage. The TypeScript client keeps the active connection and callbacks. Reopening the database restores the saved work available to an authorized run.\n\n## Share resources between runs\n\nA grant sets the permitted tools, files, profiles, deadline, and budget. Parent runs, children, context compaction, and metered evaluations draw from a shared allowance. Each child or case can also have its own ceiling.\n\nA parent waiting for child work saves its continuation and releases its worker slot. The child can run even with one worker slot available. Evidence reads, status, and accounting use short state operations while commands execute separately.\n\nAttachment usage reports Ribosome's grant usage. To include the source agent in the same measured budget, its host transport must participate in the accounting interface. See [shared resource accounting](../../protocol.md#shared-resource-accounting).\n\n## Continue after interruption\n\nRepeat an interrupted run with its unchanged configuration and a valid grant. Ribosome restores its continuation, checks that its sources remain available, and reconciles recorded effects before proceeding.\n\nAn observed action result can complete its pending bookkeeping without executing the action again. An action with an unknown outcome needs owner inspection and settlement. [Operations](../reference/operations.md) gives the commands and recovery steps.\n","headings":[{"level":"h2","id":"choose-how-work-starts","text":"Choose how work starts"},{"level":"h2","id":"run-beside-another-agent","text":"Run beside another agent"},{"level":"h2","id":"where-work-is-saved","text":"Where work is saved"},{"level":"h2","id":"share-resources-between-runs","text":"Share resources between runs"},{"level":"h2","id":"continue-after-interruption","text":"Continue after interruption"}],"source":"https://github.com/TheodoreGalanos/ribosome/blob/main/docs/content/guides/runtime.md"},{"slug":"guides/repair","title":"Repair an artifact","description":"Give maintenance temporary control of selected writes and require checks.","group":"Guides","html":"\u003ch1 id=\"repair-an-artifact\">Repair an artifact\u003c/h1>\n\u003cp>A finding is advice. A repair additionally requires artifact access, permitted tools, mandatory checks, and control over competing writes.\u003c/p>\n\u003ch2 id=\"choose-the-level-of-access\">Choose the level of access\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Grant mode\u003c/th>\n\u003cth>Allowed work\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>observe\u003c/code>\u003c/td>\n\u003ctd>Read evidence and return findings.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>sandbox\u003c/code>\u003c/td>\n\u003ctd>Work in a separate copy of permitted files.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>apply\u003c/code>\u003c/td>\n\u003ctd>Request live changes through the host&#39;s checks and permissions.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>The local \u003ccode>sandbox\u003c/code> mode uses a copied workspace and trusted registered tools. Choose an appropriately isolated executor when your application needs to run untrusted code.\u003c/p>\n\u003ch2 id=\"coordinate-shared-writes\">Coordinate shared writes\u003c/h2>\n\u003cp>Enable \u003ccode>attachment.allow_coordinated_writes\u003c/code> in the host configuration and \u003ccode>coordinatedWrites\u003c/code> when attaching. Use an \u003ccode>apply\u003c/code> grant with \u003ccode>writable_paths\u003c/code>, registered tools, and nonempty \u003ccode>required_checks\u003c/code>.\u003c/p>\n\u003cp>Wrap \u003cstrong>every external writer from the start\u003c/strong> in the same coordinator:\u003c/p>\n\u003cdiv class=\"code-block\">\u003cdiv class=\"code-top\">\u003cspan>ts\u003c/span>\u003cbutton class=\"copy\" aria-label=\"Copy code\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode>import { WriteCoordinator } from &#39;@ribosome/agents/attachments&#39;;\n\nconst writer = new WriteCoordinator();\n\n// Inside each application tool that changes the workspace:\nawait writer.run(() =&gt; updateArtifact());\n\n// At an application-controlled repair boundary:\nawait attachment.finish();\nawait attachment.repair(writer);\nawait attachment.finish();\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>\u003ccode>attachment\u003c/code> is your configured connection; \u003ccode>updateArtifact\u003c/code> is an application-owned operation.\u003c/p>\n\u003ch2 id=\"check-the-outcome\">Check the outcome\u003c/h2>\n\u003cp>The caretaker investigates, edits a branch, and requests checked application. The host enforces its mandatory checks even when the proposal omits them.\u003c/p>\n\u003cp>Inspect the feedback, actual artifact, and check receipts to establish whether the repair succeeded. \u003ccode>repair()\u003c/code> resolves when writer ownership has been settled. Each local application operation applies the selected artifact.\u003c/p>\n\u003cp>Checks record the artifact version and properties they validate. After an input changes, affected results become stale. A fresh authorized check can restore support for the properties it covers; downstream results remain stale until their own required checks establish support.\u003c/p>\n\u003ch2 id=\"on-interruption\">On interruption\u003c/h2>\n\u003cp>A timeout or lost connection leaves the writer stopped. Inspect the handoff and effect receipts before reconciling with the original coordinator. When an action outcome was captured, recovery finishes its bookkeeping without repeating the action. Unknown outcomes require owner inspection and settlement.\u003c/p>\n\u003cp>See \u003ca href=\"#reference/operations\">Operations\u003c/a> for settlement and fresh checks. The reference path supports one coordinated attachment per workspace.\u003c/p>\n","text":"\n# Repair an artifact\n\nA finding is advice. A repair additionally requires artifact access, permitted tools, mandatory checks, and control over competing writes.\n\n## Choose the level of access\n\n| Grant mode | Allowed work |\n| --- | --- |\n| `observe` | Read evidence and return findings. |\n| `sandbox` | Work in a separate copy of permitted files. |\n| `apply` | Request live changes through the host's checks and permissions. |\n\nThe local `sandbox` mode uses a copied workspace and trusted registered tools. Choose an appropriately isolated executor when your application needs to run untrusted code.\n\n## Coordinate shared writes\n\nEnable `attachment.allow_coordinated_writes` in the host configuration and `coordinatedWrites` when attaching. Use an `apply` grant with `writable_paths`, registered tools, and nonempty `required_checks`.\n\nWrap **every external writer from the start** in the same coordinator:\n\n```ts\nimport { WriteCoordinator } from '@ribosome/agents/attachments';\n\nconst writer = new WriteCoordinator();\n\n// Inside each application tool that changes the workspace:\nawait writer.run(() => updateArtifact());\n\n// At an application-controlled repair boundary:\nawait attachment.finish();\nawait attachment.repair(writer);\nawait attachment.finish();\n```\n\n`attachment` is your configured connection; `updateArtifact` is an application-owned operation.\n\n## Check the outcome\n\nThe caretaker investigates, edits a branch, and requests checked application. The host enforces its mandatory checks even when the proposal omits them.\n\nInspect the feedback, actual artifact, and check receipts to establish whether the repair succeeded. `repair()` resolves when writer ownership has been settled. Each local application operation applies the selected artifact.\n\nChecks record the artifact version and properties they validate. After an input changes, affected results become stale. A fresh authorized check can restore support for the properties it covers; downstream results remain stale until their own required checks establish support.\n\n## On interruption\n\nA timeout or lost connection leaves the writer stopped. Inspect the handoff and effect receipts before reconciling with the original coordinator. When an action outcome was captured, recovery finishes its bookkeeping without repeating the action. Unknown outcomes require owner inspection and settlement.\n\nSee [Operations](../reference/operations.md) for settlement and fresh checks. The reference path supports one coordinated attachment per workspace.\n","headings":[{"level":"h2","id":"choose-the-level-of-access","text":"Choose the level of access"},{"level":"h2","id":"coordinate-shared-writes","text":"Coordinate shared writes"},{"level":"h2","id":"check-the-outcome","text":"Check the outcome"},{"level":"h2","id":"on-interruption","text":"On interruption"}],"source":"https://github.com/TheodoreGalanos/ribosome/blob/main/docs/content/guides/repair.md"},{"slug":"guides/discovery","title":"Discover a behavior","description":"Ask a curator to investigate execution evidence and describe a useful local function.","group":"Guides","html":"\u003ch1 id=\"discover-a-behavior\">Discover a behavior\u003c/h1>\n\u003cp>Give a curator a set of execution observations to investigate. It can compare decisions, examine their consequences, and describe a behavior that may be useful elsewhere.\u003c/p>\n\u003cp>For example, a task may fail overall even though one worker correctly reconciled conflicting measurements. A discovery investigation can preserve that local behavior with the conditions under which it worked.\u003c/p>\n\u003ch2 id=\"supply-the-evidence\">Supply the evidence\u003c/h2>\n\u003cp>Capture the source events and artifact versions first. Then register a \u003ccode>DiscoveryCorpus\u003c/code> through \u003ccode>Store::register_discovery_corpus\u003c/code>, or include it in the CLI configuration&#39;s \u003ccode>corpora\u003c/code> list. Set \u003ccode>request.discovery_corpus\u003c/code> to its ID.\u003c/p>\n\u003cp>The corpus selects event windows, historical artifact snapshots, and any definitions the curator may inspect. It also records whether the investigation represents information available during execution or a retrospective view.\u003c/p>\n\u003cp>For an investigation meant to represent a decision during execution, supply only evidence available at that point. Use a separate retrospective investigation to study later outcomes.\u003c/p>\n\u003ch2 id=\"run-the-investigation\">Run the investigation\u003c/h2>\n\u003cp>Use the \u003ccode>curator\u003c/code> profile and \u003ccode>discovery@1\u003c/code> operator. The curator can read the assignment, search raw events, inspect neighboring events, and retrieve the selected artifact versions. It can request a bounded \u003ccode>contrast-motif@1\u003c/code> child to compare an interpretation with alternatives.\u003c/p>\n\u003cp>The host checks that cited sources were retrieved. The curator supplies the interpretation: what conditions matter, what action serves the function, and what the evidence supports.\u003c/p>\n\u003ch2 id=\"read-the-result\">Read the result\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Record\u003c/th>\n\u003cth>What to inspect\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Definition\u003c/td>\n\u003ctd>The function, conditions, required observations, and expected result.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Occurrence\u003c/td>\n\u003ctd>The actual events and artifact versions supporting the interpretation.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Discovery\u003c/td>\n\u003ctd>The investigation, alternatives considered, uncertainty, and outcome.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>\u003ccode>no_motif\u003c/code> and \u003ccode>inconclusive\u003c/code> are useful outcomes when the supplied evidence does not support a candidate. Review the saved records before requesting extraction into executable instructions.\u003c/p>\n\u003ch2 id=\"try-the-learning-example\">Try the learning example\u003c/h2>\n\u003cp>The \u003ca href=\"https://github.com/TheodoreGalanos/ribosome/blob/main/examples/learned-behavior/README.md\">installed-consumer example\u003c/a> prepares four authored source episodes using actual file operations. Its live path asks a curator to discover behavior, extracts instructions if a candidate is ready, and plans baseline/candidate runs on two recipient cases.\u003c/p>\n\u003cp>The observed trial stopped after an inconclusive investigation. Use its retained report to understand which stages ran. See \u003ca href=\"#evaluation/support\">Current support\u003c/a> for that result and the separate tests of execution machinery.\u003c/p>\n\u003cp>Next: \u003ca href=\"#guides/reuse\">Reuse a procedure\u003c/a>.\u003c/p>\n","text":"\n# Discover a behavior\n\nGive a curator a set of execution observations to investigate. It can compare decisions, examine their consequences, and describe a behavior that may be useful elsewhere.\n\nFor example, a task may fail overall even though one worker correctly reconciled conflicting measurements. A discovery investigation can preserve that local behavior with the conditions under which it worked.\n\n## Supply the evidence\n\nCapture the source events and artifact versions first. Then register a `DiscoveryCorpus` through `Store::register_discovery_corpus`, or include it in the CLI configuration's `corpora` list. Set `request.discovery_corpus` to its ID.\n\nThe corpus selects event windows, historical artifact snapshots, and any definitions the curator may inspect. It also records whether the investigation represents information available during execution or a retrospective view.\n\nFor an investigation meant to represent a decision during execution, supply only evidence available at that point. Use a separate retrospective investigation to study later outcomes.\n\n## Run the investigation\n\nUse the `curator` profile and `discovery@1` operator. The curator can read the assignment, search raw events, inspect neighboring events, and retrieve the selected artifact versions. It can request a bounded `contrast-motif@1` child to compare an interpretation with alternatives.\n\nThe host checks that cited sources were retrieved. The curator supplies the interpretation: what conditions matter, what action serves the function, and what the evidence supports.\n\n## Read the result\n\n| Record | What to inspect |\n| --- | --- |\n| Definition | The function, conditions, required observations, and expected result. |\n| Occurrence | The actual events and artifact versions supporting the interpretation. |\n| Discovery | The investigation, alternatives considered, uncertainty, and outcome. |\n\n`no_motif` and `inconclusive` are useful outcomes when the supplied evidence does not support a candidate. Review the saved records before requesting extraction into executable instructions.\n\n## Try the learning example\n\nThe [installed-consumer example](../../../examples/learned-behavior/README.md) prepares four authored source episodes using actual file operations. Its live path asks a curator to discover behavior, extracts instructions if a candidate is ready, and plans baseline/candidate runs on two recipient cases.\n\nThe observed trial stopped after an inconclusive investigation. Use its retained report to understand which stages ran. See [Current support](../evaluation/support.md) for that result and the separate tests of execution machinery.\n\nNext: [Reuse a procedure](reuse.md).\n","headings":[{"level":"h2","id":"supply-the-evidence","text":"Supply the evidence"},{"level":"h2","id":"run-the-investigation","text":"Run the investigation"},{"level":"h2","id":"read-the-result","text":"Read the result"},{"level":"h2","id":"try-the-learning-example","text":"Try the learning example"}],"source":"https://github.com/TheodoreGalanos/ribosome/blob/main/docs/content/guides/discovery.md"},{"slug":"guides/reuse","title":"Reuse a procedure","description":"Prepare instructions, test their behavior, and execute them on fresh inputs.","group":"Guides","html":"\u003ch1 id=\"reuse-a-procedure\">Reuse a procedure\u003c/h1>\n\u003cp>Ribosome can turn a candidate behavior into prepared instructions that a Pi agent executes on a receiving task. The implementation carries its requirements, bindings, and limitations so the application can decide where to use it.\u003c/p>\n\u003ch2 id=\"prepare-and-evaluate\">Prepare and evaluate\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Stage\u003c/th>\n\u003cth>Result\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Inspect source evidence\u003c/td>\n\u003ctd>A candidate behavior and its grounding.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Extract an implementation\u003c/td>\n\u003ctd>Executable instructions or a host-registered procedure.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Evaluate\u003c/td>\n\u003ctd>Fresh task results from a host-controlled comparison.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Admit\u003c/td>\n\u003ctd>Acceptance of that implementation version in a stated context.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Reuse\u003c/td>\n\u003ctd>A new run with recipient inputs, actions, and checks.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Use \u003ccode>extraction@1\u003c/code> to prepare behavior from a reviewed investigation. An instruction implementation uses \u003ccode>format: &quot;instructions&quot;\u003c/code>. Your host then schedules \u003ccode>execute-motif@1\u003c/code> with the selected implementation version and recipient bindings. Host-registered procedures use the existing action execution path.\u003c/p>\n\u003ch2 id=\"find-an-implementation\">Find an implementation\u003c/h2>\n\u003cp>The evidence inventory retains candidates, failed attempts, and evaluations. Query the usable inventory to find implementations admitted for the caller&#39;s context.\u003c/p>\n\u003cp>Search supports text relevance and exact function filters. \u003ccode>eligible: true\u003c/code> filters by available capabilities; \u003ccode>inventory: &quot;usable&quot;\u003c/code> also requires contextual admission. The receiving agent still checks the implementation&#39;s assumptions against the current task.\u003c/p>\n\u003ch2 id=\"execute-on-recipient-inputs\">Execute on recipient inputs\u003c/h2>\n\u003cp>The prepared run receives the selected definition, implementation, memory, admission, and explicit recipient evidence. It reads current inputs and obtains new action and check receipts. Source relationships remain available for withdrawal checks, while the recipient&#39;s readable material is limited to the prepared selection and its own work.\u003c/p>\n\u003cp>Production invocation requires contextual admission. For an experiment, the host can authorize a sandbox run of a candidate before admission. Schedule additional investigation or another prepared invocation as a separately scoped run.\u003c/p>\n\u003ch2 id=\"try-it\">Try it\u003c/h2>\n\u003cp>After building from the \u003ca href=\"#start/quickstart\">quickstart\u003c/a>, prepare a learning trial:\u003c/p>\n\u003cdiv class=\"code-block\">\u003cdiv class=\"code-top\">\u003cspan>sh\u003c/span>\u003cbutton class=\"copy\" aria-label=\"Copy code\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode>node examples/learned-behavior/demo.mjs --prepare .ribosome/learning-trial\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>Preparation makes no model calls. With provider settings in \u003ccode>.env\u003c/code>, start the live attempt:\u003c/p>\n\u003cdiv class=\"code-block\">\u003cdiv class=\"code-top\">\u003cspan>sh\u003c/span>\u003cbutton class=\"copy\" aria-label=\"Copy code\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode>RIBOSOME_CLI=&quot;$PWD/target/debug/ribosome&quot; node --env-file=.env \\\n  examples/learned-behavior/demo.mjs --run .ribosome/learning-trial\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>The full path shares a ceiling of 160 calls and US$1 across discovery, extraction, and four planned recipient evaluations. Provider charges can differ. Read \u003ccode>report.json\u003c/code> in the trial directory to see which stages completed. Each new trial needs a fresh directory.\u003c/p>\n\u003cp>The \u003ca href=\"https://github.com/TheodoreGalanos/ribosome/blob/main/examples/learned-behavior/README.md\">example guide\u003c/a> also explains how to copy this driver into an installed consumer. \u003ca href=\"#evaluation/experiments\">Experiments\u003c/a> explains how to assess the candidate, and \u003ca href=\"#evaluation/support\">Current support\u003c/a> records the observed results.\u003c/p>\n","text":"\n# Reuse a procedure\n\nRibosome can turn a candidate behavior into prepared instructions that a Pi agent executes on a receiving task. The implementation carries its requirements, bindings, and limitations so the application can decide where to use it.\n\n## Prepare and evaluate\n\n| Stage | Result |\n| --- | --- |\n| Inspect source evidence | A candidate behavior and its grounding. |\n| Extract an implementation | Executable instructions or a host-registered procedure. |\n| Evaluate | Fresh task results from a host-controlled comparison. |\n| Admit | Acceptance of that implementation version in a stated context. |\n| Reuse | A new run with recipient inputs, actions, and checks. |\n\nUse `extraction@1` to prepare behavior from a reviewed investigation. An instruction implementation uses `format: \"instructions\"`. Your host then schedules `execute-motif@1` with the selected implementation version and recipient bindings. Host-registered procedures use the existing action execution path.\n\n## Find an implementation\n\nThe evidence inventory retains candidates, failed attempts, and evaluations. Query the usable inventory to find implementations admitted for the caller's context.\n\nSearch supports text relevance and exact function filters. `eligible: true` filters by available capabilities; `inventory: \"usable\"` also requires contextual admission. The receiving agent still checks the implementation's assumptions against the current task.\n\n## Execute on recipient inputs\n\nThe prepared run receives the selected definition, implementation, memory, admission, and explicit recipient evidence. It reads current inputs and obtains new action and check receipts. Source relationships remain available for withdrawal checks, while the recipient's readable material is limited to the prepared selection and its own work.\n\nProduction invocation requires contextual admission. For an experiment, the host can authorize a sandbox run of a candidate before admission. Schedule additional investigation or another prepared invocation as a separately scoped run.\n\n## Try it\n\nAfter building from the [quickstart](../start/quickstart.md), prepare a learning trial:\n\n```sh\nnode examples/learned-behavior/demo.mjs --prepare .ribosome/learning-trial\n```\n\nPreparation makes no model calls. With provider settings in `.env`, start the live attempt:\n\n```sh\nRIBOSOME_CLI=\"$PWD/target/debug/ribosome\" node --env-file=.env \\\n  examples/learned-behavior/demo.mjs --run .ribosome/learning-trial\n```\n\nThe full path shares a ceiling of 160 calls and US$1 across discovery, extraction, and four planned recipient evaluations. Provider charges can differ. Read `report.json` in the trial directory to see which stages completed. Each new trial needs a fresh directory.\n\nThe [example guide](../../../examples/learned-behavior/README.md) also explains how to copy this driver into an installed consumer. [Experiments](../evaluation/experiments.md) explains how to assess the candidate, and [Current support](../evaluation/support.md) records the observed results.\n","headings":[{"level":"h2","id":"prepare-and-evaluate","text":"Prepare and evaluate"},{"level":"h2","id":"find-an-implementation","text":"Find an implementation"},{"level":"h2","id":"execute-on-recipient-inputs","text":"Execute on recipient inputs"},{"level":"h2","id":"try-it","text":"Try it"}],"source":"https://github.com/TheodoreGalanos/ribosome/blob/main/docs/content/guides/reuse.md"},{"slug":"guides/memory","title":"Project memory","description":"Save experience with its evidence and retrieve it in later project work.","group":"Guides","html":"\u003ch1 id=\"project-memory\">Project memory\u003c/h1>\n\u003cp>Memory makes selected experience available to later workflows in the same client and project. A curator decides what to retain; Rust stores and retrieves it within the configured scope.\u003c/p>\n\u003ch2 id=\"what-to-retain\">What to retain\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Kind\u003c/th>\n\u003cth>Example\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Working\u003c/td>\n\u003ctd>A temporary tool outage or an open investigation.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Episodic\u003c/td>\n\u003ctd>What failed in one run and what was tried.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Aggregated\u003c/td>\n\u003ctd>A tentative pattern supported by several episodes.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Procedural\u003c/td>\n\u003ctd>A reference to a candidate or evaluated implementation.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Failure\u003c/td>\n\u003ctd>Recognition guidance, counterexamples, and possible responses.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Keep the strength of the claim clear. An episode describes an observation. An aggregated memory describes a pattern and the evidence supporting it.\u003c/p>\n\u003ch2 id=\"structure-a-memory\">Structure a memory\u003c/h2>\n\u003cp>A \u003ccode>Memory\u003c/code> record stores \u003ccode>kind\u003c/code>, \u003ccode>content\u003c/code>, and \u003ccode>applicability\u003c/code>, plus references to its supporting evidence. It can include counterexamples, possible responses, regression cases, and an expiry time.\u003c/p>\n\u003cp>\u003ccode>conflicts\u003c/code> names records that contradict it. \u003ccode>supersedes\u003c/code> names memories it replaces. These fields contain record IDs; explain uncertainty in the content and provenance. The surrounding record supplies scope, version, and source relationships.\u003c/p>\n\u003cp>The \u003ccode>memory@1\u003c/code> operator searches existing records, reads evidence, and saves this structured knowledge. Your application can request consolidation after a run or when enough related evidence has accumulated.\u003c/p>\n\u003ch2 id=\"retrieve-it-later\">Retrieve it later\u003c/h2>\n\u003cp>Agents search stored text and exact metadata within their allowed scope. Search supports matching all terms or any terms, relevance ranking with SQLite FTS5 BM25, and bounded pages. Use \u003ccode>order: &quot;relevance&quot;\u003c/code> and \u003ccode>query_mode: &quot;any_terms&quot;\u003c/code> when those choices suit the question.\u003c/p>\n\u003cp>Search identifies candidates for the agent to assess. The agent reads applicability, evidence, and conflicts before using a memory. Procedural reuse also checks the implementation&#39;s capabilities and contextual admission. See \u003ca href=\"#guides/reuse\">Reuse a procedure\u003c/a>.\u003c/p>\n\u003ch2 id=\"keep-context-current\">Keep context current\u003c/h2>\n\u003cp>Ribosome retains source references for retrieved material, tool results, and summaries. Before the next model request, including after restart, it checks that those sources are still available. Retired, deleted, expired, or inaccessible source material is excluded from subsequent context.\u003c/p>\n\u003cp>Retirement withdraws access to a memory and dependent material. Deletion also schedules cleanup of managed copies, including saved context and summaries. An operator can inspect and retry cleanup jobs. Apply your retention policy separately to external logs and backups.\u003c/p>\n\u003cp>Long runs use retained tool results and bounded continuation state. Pi can summarize older context through metered model calls; the summary keeps its source relationships so withdrawal still applies.\u003c/p>\n\u003cp>For storage paths, see \u003ca href=\"#guides/runtime\">Runtime and storage\u003c/a>. For cleanup and backups, see the \u003ca href=\"https://github.com/TheodoreGalanos/ribosome/blob/main/docs/operations.md#rebuild-search-and-handle-failed-persistence\">operations reference\u003c/a>.\u003c/p>\n","text":"\n# Project memory\n\nMemory makes selected experience available to later workflows in the same client and project. A curator decides what to retain; Rust stores and retrieves it within the configured scope.\n\n## What to retain\n\n| Kind | Example |\n| --- | --- |\n| Working | A temporary tool outage or an open investigation. |\n| Episodic | What failed in one run and what was tried. |\n| Aggregated | A tentative pattern supported by several episodes. |\n| Procedural | A reference to a candidate or evaluated implementation. |\n| Failure | Recognition guidance, counterexamples, and possible responses. |\n\nKeep the strength of the claim clear. An episode describes an observation. An aggregated memory describes a pattern and the evidence supporting it.\n\n## Structure a memory\n\nA `Memory` record
