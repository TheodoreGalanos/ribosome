stores `kind`, `content`, and `applicability`, plus references to its supporting evidence. It can include counterexamples, possible responses, regression cases, and an expiry time.\n\n`conflicts` names records that contradict it. `supersedes` names memories it replaces. These fields contain record IDs; explain uncertainty in the content and provenance. The surrounding record supplies scope, version, and source relationships.\n\nThe `memory@1` operator searches existing records, reads evidence, and saves this structured knowledge. Your application can request consolidation after a run or when enough related evidence has accumulated.\n\n## Retrieve it later\n\nAgents search stored text and exact metadata within their allowed scope. Search supports matching all terms or any terms, relevance ranking with SQLite FTS5 BM25, and bounded pages. Use `order: \"relevance\"` and `query_mode: \"any_terms\"` when those choices suit the question.\n\nSearch identifies candidates for the agent to assess. The agent reads applicability, evidence, and conflicts before using a memory. Procedural reuse also checks the implementation's capabilities and contextual admission. See [Reuse a procedure](reuse.md).\n\n## Keep context current\n\nRibosome retains source references for retrieved material, tool results, and summaries. Before the next model request, including after restart, it checks that those sources are still available. Retired, deleted, expired, or inaccessible source material is excluded from subsequent context.\n\nRetirement withdraws access to a memory and dependent material. Deletion also schedules cleanup of managed copies, including saved context and summaries. An operator can inspect and retry cleanup jobs. Apply your retention policy separately to external logs and backups.\n\nLong runs use retained tool results and bounded continuation state. Pi can summarize older context through metered model calls; the summary keeps its source relationships so withdrawal still applies.\n\nFor storage paths, see [Runtime and storage](runtime.md). For cleanup and backups, see the [operations reference](../../operations.md#rebuild-search-and-handle-failed-persistence).\n","headings":[{"level":"h2","id":"what-to-retain","text":"What to retain"},{"level":"h2","id":"structure-a-memory","text":"Structure a memory"},{"level":"h2","id":"retrieve-it-later","text":"Retrieve it later"},{"level":"h2","id":"keep-context-current","text":"Keep context current"}],"source":"https://github.com/TheodoreGalanos/ribosome/blob/main/docs/content/guides/memory.md"},{"slug":"evaluation/experiments","title":"Experiments","description":"Test a procedure's function or compare complete agent workflows.","group":"Evaluation","html":"\u003ch1 id=\"experiments\">Experiments\u003c/h1>\n\u003cp>The laboratory runs comparisons using cases, evaluators, and acceptance rules supplied by your application. An experimenter can propose a study and interpret its results. The host executes the comparison and writes the evaluation and admission records.\u003c/p>\n\u003cp>For experiments starting from public trajectories, see \u003ca href=\"#evaluation/external-records\">External agent records\u003c/a>.\u003c/p>\n\u003ch2 id=\"choose-the-question\">Choose the question\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Study objective\u003c/th>\n\u003cth>Question\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>function\u003c/code>\u003c/td>\n\u003ctd>Does the candidate perform its declared local function on these inputs?\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>system_benefit\u003c/code>\u003c/td>\n\u003ctd>Does adding it improve verified task success compared with the available alternatives?\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>A system-benefit study compares five arms: the ordinary agent, another attempt, critique and revision, caretaker help, and the candidate behavior. Each arm starts with the same ordinary worker. The host defines any later stages and gives each case its own ceiling within one shared budget.\u003c/p>\n\u003cp>Use a function study to test a specific procedure. Use a system-benefit study when deciding whether its contribution justifies the additional work.\u003c/p>\n\u003cp>To check the complete library workflow, begin with a known instruction and a deliberate error. The \u003ca href=\"https://github.com/TheodoreGalanos/ribosome/blob/main/examples/learned-behavior/README.md#revise-and-reuse-a-known-instruction\">instruction lifecycle example\u003c/a> carries it through revision, testing, admission, memory, later use and reconsideration. Its provider fixture makes the decisions repeatable; its live configuration lets you measure a model&#39;s decisions separately.\u003c/p>\n\u003ch2 id=\"define-and-run-a-study\">Define and run a study\u003c/h2>\n\u003col>\n\u003cli>Register cases, evaluators, and an \u003ccode>AdmissionPolicy\u003c/code> in host configuration.\u003c/li>\n\u003cli>Save an \u003ccode>Experiment\u003c/code> identifying the implementation versions, arms, cases, repetitions, starting memory, measurements, and budget.\u003c/li>\n\u003cli>Run it through the host&#39;s laboratory, or start it directly with the command below.\u003c/li>\n\u003cli>Read the full report and any resulting contextual admission before reusing the candidate.\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"code-block\">\u003cdiv class=\"code-top\">\u003cspan>sh\u003c/span>\u003cbutton class=\"copy\" aria-label=\"Copy code\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode>ribosome study CONFIG.json EXPERIMENT_ID\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>The study fixes its inputs and policy when it starts. Use development cases while refining a candidate. Reserve protected cases for acceptance; their exposure is tracked by client, project, and family so later studies can recognize previously used material.\u003c/p>\n\u003cp>See the \u003ca href=\"#reference/configuration\">configuration guide\u003c/a> for the relevant host fields and the \u003ca href=\"https://github.com/TheodoreGalanos/ribosome/blob/main/docs/protocol.md#whole-agent-laboratory\">laboratory reference\u003c/a> for their contracts.\u003c/p>\n\u003ch2 id=\"run-complete-agents\">Run complete agents\u003c/h2>\n\u003cp>Register an \u003ccode>agent_evaluators\u003c/code> entry to run actual Pi subjects with prepared instructions. Each case gets a fresh workspace, project namespace, restricted grant, and selected starting memory.\u003c/p>\n\u003cp>A host can define up to four stages per arm. A later stage receives the preceding summary, current branch, and fresh receipt references. For example, a caretaker can work on the ordinary worker&#39;s result. Local case exhaustion leaves other funded cases eligible to run.\u003c/p>\n\u003cp>The built-in adapter starts each case with fixed memory. Use a host evaluator with explicit learning-state handling for studies that retain learning across cases.\u003c/p>\n\u003ch2 id=\"check-task-outcomes\">Check task outcomes\u003c/h2>\n\u003cp>The protected judge receives expected answers and other oracle data after subject execution, outside the subject&#39;s workspace and model context. Built-in judges are offline commands that inspect the actual result. Optional secondary judges retain disagreements as inconclusive outcomes.\u003c/p>\n\u003cp>A failed task is an observed result. A judge that cannot execute is an evaluation failure. Reports preserve both, along with exhaustion, cancellation, and cases that never ran.\u003c/p>\n\u003cp>An LLM judge needs a host evaluator that accounts for its provider calls through \u003ccode>EvaluationAccount\u003c/code>. Subject, maintenance, compaction, and metered evaluator calls share the study&#39;s allowance.\u003c/p>\n\u003ch2 id=\"read-the-report\">Read the report\u003c/h2>\n\u003cp>Start with verified successes out of all planned cases. Then read execution status, usage completeness, case and family counts, and the paired comparisons. System-benefit acceptance requires the declared improvement over every control and complete usage.\u003c/p>\n\u003cp>Learning cost records its observed amount, completeness, and declared reuse count. Report it alongside execution cost when assessing the total cost of reuse.\u003c/p>\n\u003cp>An admission supports one implementation version in a stated context. The archive can retain evaluated alternatives for different conditions, with their full evidence references. \u003ca href=\"#evaluation/support\">Current support\u003c/a> summarizes the completed development study and its inconclusive result.\u003c/p>\n","text":"\n# Experiments\n\nThe laboratory runs comparisons using cases, evaluators, and acceptance rules supplied by your application. An experimenter can propose a study and interpret its results. The host executes the comparison and writes the evaluation and admission records.\n\nFor experiments starting from public trajectories, see [External agent records](external-records.md).\n\n## Choose the question\n\n| Study objective | Question |\n| --- | --- |\n| `function` | Does the candidate perform its declared local function on these inputs? |\n| `system_benefit` | Does adding it improve verified task success compared with the available alternatives? |\n\nA system-benefit study compares five arms: the ordinary agent, another attempt, critique and revision, caretaker help, and the candidate behavior. Each arm starts with the same ordinary worker. The host defines any later stages and gives each case its own ceiling within one shared budget.\n\nUse a function study to test a specific procedure. Use a system-benefit study when deciding whether its contribution justifies the additional work.\n\nTo check the complete library workflow, begin with a known instruction and a deliberate error. The [instruction lifecycle example](../../../examples/learned-behavior/README.md#revise-and-reuse-a-known-instruction) carries it through revision, testing, admission, memory, later use and reconsideration. Its provider fixture makes the decisions repeatable; its live configuration lets you measure a model's decisions separately.\n\n## Define and run a study\n\n1. Register cases, evaluators, and an `AdmissionPolicy` in host configuration.\n2. Save an `Experiment` identifying the implementation versions, arms, cases, repetitions, starting memory, measurements, and budget.\n3. Run it through the host's laboratory, or start it directly with the command below.\n4. Read the full report and any resulting contextual admission before reusing the candidate.\n\n```sh\nribosome study CONFIG.json EXPERIMENT_ID\n```\n\nThe study fixes its inputs and policy when it starts. Use development cases while refining a candidate. Reserve protected cases for acceptance; their exposure is tracked by client, project, and family so later studies can recognize previously used material.\n\nSee the [configuration guide](../reference/configuration.md) for the relevant host fields and the [laboratory reference](../../protocol.md#whole-agent-laboratory) for their contracts.\n\n## Run complete agents\n\nRegister an `agent_evaluators` entry to run actual Pi subjects with prepared instructions. Each case gets a fresh workspace, project namespace, restricted grant, and selected starting memory.\n\nA host can define up to four stages per arm. A later stage receives the preceding summary, current branch, and fresh receipt references. For example, a caretaker can work on the ordinary worker's result. Local case exhaustion leaves other funded cases eligible to run.\n\nThe built-in adapter starts each case with fixed memory. Use a host evaluator with explicit learning-state handling for studies that retain learning across cases.\n\n## Check task outcomes\n\nThe protected judge receives expected answers and other oracle data after subject execution, outside the subject's workspace and model context. Built-in judges are offline commands that inspect the actual result. Optional secondary judges retain disagreements as inconclusive outcomes.\n\nA failed task is an observed result. A judge that cannot execute is an evaluation failure. Reports preserve both, along with exhaustion, cancellation, and cases that never ran.\n\nAn LLM judge needs a host evaluator that accounts for its provider calls through `EvaluationAccount`. Subject, maintenance, compaction, and metered evaluator calls share the study's allowance.\n\n## Read the report\n\nStart with verified successes out of all planned cases. Then read execution status, usage completeness, case and family counts, and the paired comparisons. System-benefit acceptance requires the declared improvement over every control and complete usage.\n\nLearning cost records its observed amount, completeness, and declared reuse count. Report it alongside execution cost when assessing the total cost of reuse.\n\nAn admission supports one implementation version in a stated context. The archive can retain evaluated alternatives for different conditions, with their full evidence references. [Current support](support.md) summarizes the completed development study and its inconclusive result.\n","headings":[{"level":"h2","id":"choose-the-question","text":"Choose the question"},{"level":"h2","id":"define-and-run-a-study","text":"Define and run a study"},{"level":"h2","id":"run-complete-agents","text":"Run complete agents"},{"level":"h2","id":"check-task-outcomes","text":"Check task outcomes"},{"level":"h2","id":"read-the-report","text":"Read the report"}],"source":"https://github.com/TheodoreGalanos/ribosome/blob/main/docs/content/evaluation/experiments.md"},{"slug":"evaluation/external-records","title":"External agent records","description":"Import source trajectories, inspect their evidence and test discovered instructions.","group":"Evaluation","html":"\u003ch1 id=\"external-agent-records\">External agent records\u003c/h1>\n\u003cp>Use an existing agent execution as evidence for a new investigation. Ribosome can import its messages and tool interactions, let a caretaker inspect a selected window, and let a curator propose a reusable behaviour. A supported discovery can become an instruction for a fresh local task.\u003c/p>\n\u003cp>The optional \u003ccode>ribosome-import\u003c/code> crate reads local JSON, JSONL, compressed JSONL and Parquet. Its network feature reads revision-pinned Hugging Face Parquet files. Included profiles cover AEC-Bench engineering rollouts and Nebius software-agent trajectories.\u003c/p>\n\u003ch2 id=\"follow-one-execution\">Follow one execution\u003c/h2>\n\u003col>\n\u003cli>Import source rows with a profile that defines fields, joins and message decoding.\u003c/li>\n\u003cli>Inspect the coverage report: messages, tool calls, paired results, timestamps and missing evidence.\u003c/li>\n\u003cli>Assign complete episodes or fixed prefixes through a host-owned corpus.\u003c/li>\n\u003cli>Run an audit or discovery and inspect its saved evidence references.\u003c/li>\n\u003cli>Challenge a supported definition, extract an instruction and test it on fresh recipient tasks.\u003c/li>\n\u003c/ol>\n\u003cp>The \u003ca href=\"https://github.com/TheodoreGalanos/ribosome/blob/main/examples/offline-lab/README.md\">runnable offline lab\u003c/a> includes commands, profiles and the study-plan fields. Its \u003ca href=\"https://github.com/TheodoreGalanos/ribosome/blob/main/examples/offline-lab/profiles/README.md\">YAML profile guide\u003c/a> explains field mapping and how recorded tool calls can guide evidence selection. Preparation makes no model calls. Live stages share a bounded allowance and save incomplete attempts alongside completed work.\u003c/p>\n\u003ch2 id=\"control-what-an-agent-can-read\">Control what an agent can read\u003c/h2>\n\u003cp>The profile describes the source format. The generated source lock records the revision, concrete files and selected episode identities. The study manifest decides which messages and artifact parts each investigation can read.\u003c/p>\n\u003cp>An acquisition directory uses one profile. When its mappings change, prepare a new directory. Local and Hugging Face imports check this before reading or writing source files, and reuse checks the episode&#39;s task, family, metadata and annotations.\u003c/p>\n\u003cp>Publisher rewards, final-output sidecars and unclassified source fields stay in the owner files. Imported source messages remain quoted observations. A fixed prefix includes only its selected message parts, so reading an early message does not expose a later transcript through a shared artifact.\u003c/p>\n\u003cp>Large messages have ordered parts. An agent must read those parts before concluding that a result or check is absent. Coverage reports preserve pending tool calls and missing timestamps, which helps the owner choose experiments the episode can support.\u003c/p>\n\u003cp>Event sequences preserve message order. Parent links connect tool results to identified calls; adjacent independent messages have no dependency link. Curators can retain other proposed relationships as inferences.\u003c/p>\n\u003cp>To rebuild evidence published before the parent-link correction, assign it under a new study ID. Earlier stored events and experiment results retain their original links.\u003c/p>\n\u003ch2 id=\"reuse-and-withdraw-evidence\">Reuse and withdraw evidence\u003c/h2>\n\u003cp>Imported episodes use the ordinary Ribosome store and source links. Findings and memories can cite their events, then be retrieved in a later workflow. Withdrawing an imported source removes its generated message files and makes dependent records and saved context unavailable.\u003c/p>\n\u003cp>The function study executes a prepared instruction through the ordinary Pi worker with experimental purpose. Its fresh cases separate subject input from the independent judge&#39;s answers. The system comparison adds retry, critique and caretaker controls under shared case budgets. See \u003ca href=\"#evaluation/experiments\">Experiments\u003c/a>.\u003c/p>\n\u003ch2 id=\"read-the-first-results\">Read the first results\u003c/h2>\n\u003cp>The twelve-episode development investigation used six AEC episodes and six Nebius episodes. A curator completed a source-linked investigation and extracted a path instruction from inspected EDK2 code and tests. The ordinary Pi executor tested it on two fresh tasks, twice each, alongside a baseline. The model and output allowance also changed during development, so completion cannot be attributed to budget alone.\u003c/p>\n\u003cp>The instruction respected an applicability boundary but failed its intended function. It preserved the already correct incompatible result in both trials and failed both applicable path-resolution trials. It was not admitted. The final contrast rejected applying the path definition to the two GeoPandas test excerpts it inspected.\u003c/p>\n\u003cp>The pilot is closed with those outcomes. E6, the broader system comparison, is deferred until a candidate demonstrates its local function. Read the \u003ca href=\"https://github.com/TheodoreGalanos/ribosome/blob/main/examples/offline-lab/expanded-results.md\">expanded results\u003c/a> for the case outcomes, access fixes and remaining research questions, and the \u003ca href=\"https://github.com/TheodoreGalanos/ribosome/blob/main/examples/offline-lab/results.md\">first pilot\u003c/a> for the earlier attempts.\u003c/p>\n\u003cp>The \u003ca href=\"https://github.com/TheodoreGalanos/ribosome/blob/main/examples/offline-lab/behavior-results.md\">agent-strategy follow-up\u003c/a> investigates an observed warning repair and tests its instruction on fresh configuration tasks. Discovery, a nearby contrast and extraction completed. After a first study exposed an ambiguous recipient field, an explicit-contract repeat passed all eight executions: the candidate matched baseline on these local cases. Both attempts, the instruction and source excerpts are available for inspection.\u003c/p>\n","text":"\n# External agent records\n\nUse an existing agent execution as evidence for a new investigation. Ribosome can import its messages and tool interactions, let a caretaker inspect a selected window, and let a curator propose a reusable behaviour. A supported discovery can become an instruction for a fresh local task.\n\nThe optional `ribosome-import` crate reads local JSON, JSONL, compressed JSONL and Parquet. Its network feature reads revision-pinned Hugging Face Parquet files. Included profiles cover AEC-Bench engineering rollouts and Nebius software-agent trajectories.\n\n## Follow one execution\n\n1. Import source rows with a profile that defines fields, joins and message decoding.\n2. Inspect the coverage report: messages, tool calls, paired results, timestamps and missing evidence.\n3. Assign complete episodes or fixed prefixes through a host-owned corpus.\n4. Run an audit or discovery and inspect its saved evidence references.\n5. Challenge a supported definition, extract an instruction and test it on fresh recipient tasks.\n\nThe [runnable offline lab](../../../examples/offline-lab/README.md) includes commands, profiles and the study-plan fields. Its [YAML profile guide](../../../examples/offline-lab/profiles/README.md) explains field mapping and how recorded tool calls can guide evidence selection. Preparation makes no model calls. Live stages share a bounded allowance and save incomplete attempts alongside completed work.\n\n## Control what an agent can read\n\nThe profile describes the source format. The generated source lock records the revision, concrete files and selected episode identities. The study manifest decides which messages and artifact parts each investigation can read.\n\nAn acquisition directory uses one profile. When its mappings change, prepare a new directory. Local and Hugging Face imports check this before reading or writing source files, and reuse checks the episode's task, family, metadata and annotations.\n\nPublisher rewards, final-output sidecars and unclassified source fields stay in the owner files. Imported source messages remain quoted observations. A fixed prefix includes only its selected message parts, so reading an early message does not expose a later transcript through a shared artifact.\n\nLarge messages have ordered parts. An agent must read those parts before concluding that a result or check is absent. Coverage reports preserve pending tool calls and missing timestamps, which helps the owner choose experiments the episode can support.\n\nEvent sequences preserve message order. Parent links connect tool results to identified calls; adjacent independent messages have no dependency link. Curators can retain other proposed relationships as inferences.\n\nTo rebuild evidence published before the parent-link correction, assign it under a new study ID. Earlier stored events and experiment results retain their original links.\n\n## Reuse and withdraw evidence\n\nImported episodes use the ordinary Ribosome store and source links. Findings and memories can cite their events, then be retrieved in a later workflow. Withdrawing an imported source removes its generated message files and makes dependent records and saved context unavailable.\n\nThe function study executes a prepared instruction through the ordinary Pi worker with experimental purpose. Its fresh cases separate subject input from the independent judge's answers. The system comparison adds retry, critique and caretaker controls under shared case budgets. See [Experiments](experiments.md).\n\n## Read the first results\n\nThe twelve-episode development investigation used six AEC episodes and six Nebius episodes. A curator completed a source-linked investigation and extracted a path instruction from inspected EDK2 code and tests. The ordinary Pi executor tested it on two fresh tasks, twice each, alongside a baseline. The model and output allowance also changed during development, so completion cannot be attributed to budget alone.\n\nThe instruction respected an applicability boundary but failed its intended function. It preserved the already correct incompatible result in both trials and failed both applicable path-resolution trials. It was not admitted. The final contrast rejected applying the path definition to the two GeoPandas test excerpts it inspected.\n\nThe pilot is closed with those outcomes. E6, the broader system comparison, is deferred until a candidate demonstrates its local function. Read the [expanded results](../../../examples/offline-lab/expanded-results.md) for the case outcomes, access fixes and remaining research questions, and the [first pilot](../../../examples/offline-lab/results.md) for the earlier attempts.\n\n\nThe [agent-strategy follow-up](../../../examples/offline-lab/behavior-results.md) investigates an observed warning repair and tests its instruction on fresh configuration tasks. Discovery, a nearby contrast and extraction completed. After a first study exposed an ambiguous recipient field, an explicit-contract repeat passed all eight executions: the candidate matched baseline on these local cases. Both attempts, the instruction and source excerpts are available for inspection.\n","headings":[{"level":"h2","id":"follow-one-execution","text":"Follow one execution"},{"level":"h2","id":"control-what-an-agent-can-read","text":"Control what an agent can read"},{"level":"h2","id":"reuse-and-withdraw-evidence","text":"Reuse and withdraw evidence"},{"level":"h2","id":"read-the-first-results","text":"Read the first results"}],"source":"https://github.com/TheodoreGalanos/ribosome/blob/main/docs/content/evaluation/external-records.md"},{"slug":"evaluation/support","title":"Current support","description":"Available capabilities and the results of the implementation and learning checks.","group":"Evaluation","html":"\u003ch1 id=\"current-support\">Current support\u003c/h1>\n\u003cp>Ribosome is an early-stage local library. The R1–R7 implementation is complete and available from source. Its automated checks and live trials answer different questions: whether the library carries out the work correctly, and whether a model produces useful behavior on the supplied tasks.\u003c/p>\n\u003ch2 id=\"available-now\">Available now\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Area\u003c/th>\n\u003cth>Current capability\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Attachment\u003c/td>\n\u003ctd>Pi and generic connectors, startup or mid-run observation, feedback, and optional steering.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Repair and recovery\u003c/td>\n\u003ctd>Cooperative writes, required checks, recorded action outcomes, and owner settlement for uncertain effects.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Runtime\u003c/td>\n\u003ctd>Saved continuations, queued child work, responsive state operations, and shared resource accounting.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Memory\u003c/td>\n\u003ctd>Scoped records, source-aware context, withdrawal, and ranked text retrieval.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Discovery\u003c/td>\n\u003ctd>Bounded evidence investigation, functional definitions, grounded occurrences, and contrast work.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Prepared behavior\u003c/td>\n\u003ctd>Pi execution of selected instructions on recipient inputs, with capabilities and admission checks.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Laboratory\u003c/td>\n\u003ctd>Isolated agent cases, five-arm system comparisons, protected judging, and contextual admission.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"observed-checks\">Observed checks\u003c/h2>\n\u003cp>The recorded R7 handoff passed 15 focused mechanical check groups and 22 installed-consumer checks. These covered the packaged TypeScript worker and installed Rust executable, attachment and recovery, prepared invocation, fresh checks, and appropriate abstention. Provider fixtures exercised those mechanisms without paid calls.\u003c/p>\n\u003cp>The combined recovery check applied a repair, interrupted its bookkeeping, resumed with one recorded application, restored the target through a fresh check, and left unchecked downstream work stale. It also verified that retired memory was excluded from the next provider context.\u003c/p>\n\u003cp>These are recorded implementation checks. See the \u003ca href=\"https://github.com/TheodoreGalanos/ribosome/blob/main/docs/validation.md#r7-integrated-qualification-and-handoff\">validation report\u003c/a> and \u003ca href=\"https://github.com/TheodoreGalanos/ribosome/blob/main/docs/qualification/evidence.json\">sanitized evidence snapshot\u003c/a> for their source state and results.\u003c/p>\n\u003cp>The \u003ca href=\"https://github.com/TheodoreGalanos/ribosome/blob/main/examples/learned-behavior/README.md#revise-and-reuse-a-known-instruction\">instruction lifecycle example\u003c/a> connects revision, evaluation, admission, memory, retrieval and execution in one check. A faulty row-reconciliation rule fails a case, a revised rule passes both cases, and a later agent uses it while preserving independent work. A units counterexample then triggers withdrawal. The check confirms that the instruction and its linked memory leave retrieval and that Rust refuses another production invocation. Provider responses are authored; Pi execution and Rust state changes are real.\u003c/p>\n\u003cp>The external-trajectory campaign also exposed a contrast access bug: checks on a definition&#39;s supporting files blocked its delivery and later cleared the reviewer&#39;s context. The corrected path checks source availability while keeping donor files outside the review assignment. A regression now covers reading, retrieval, continued context and withdrawal. The live rerun completed with one context segment and saved a rejected match against the inspected GeoPandas excerpts. The \u003ca href=\"https://github.com/TheodoreGalanos/ribosome/blob/main/examples/offline-lab/expanded-results.md\">external-data pilot\u003c/a> is closed, with its broader system comparison deferred after a negative function result.\u003c/p>\n\u003ch2 id=\"external-data-development-pilot\">External-data development pilot\u003c/h2>\n\u003cp>The external-data pilot completed discovery, extraction and eight fresh task executions. The candidate preserved an already correct incompatible result but failed both applicable path-resolution trials. It was not admitted, and the broader system comparison was deferred.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Stage\u003c/th>\n\u003cth>Observed result\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Import\u003c/td>\n\u003ctd>Twelve AEC-Bench and Nebius episodes acquired and used in development investigations.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Discovery and extraction\u003c/td>\n\u003ctd>A definition, occurrence, investigation and instruction describing an EDK2 domain procedure.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Contrast\u003c/td>\n\u003ctd>Rejected a match against two inspected GeoPandas excerpts.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Applicable task\u003c/td>\n\u003ctd>Baseline 0/2; candidate 0/2. Both candidate trials failed path resolution.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Incompatible task\u003c/td>\n\u003ctd>Baseline 1/2; candidate 2/2. Both candidate trials preserved the correct output.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>The \u003ca href=\"https://github.com/TheodoreGalanos/ribosome/blob/main/examples/offline-lab/expanded-results.md#what-the-candidate-carried-forward\">candidate and case outputs\u003c/a> make the instruction and its failures inspectable. This small development study supports analysis of those cases; broader transfer remains an open question.\u003c/p>\n\u003ch2 id=\"agent-strategy-follow-up\">Agent-strategy follow-up\u003c/h2>\n\u003cp>A later investigation used a numpydoc execution to identify an agent strategy: inspect a warning&#39;s route and actual wrapper metadata, adapt a contradicted assumption, then check the contextual and context-free cases. Discovery, a nearby contrast and extraction completed after an interrupted attempt and owner-scheduled continuation.\u003c/p>\n\u003cp>The first eight configuration-task executions exposed an ambiguous field meaning in the recipient contract. After clarifying that meaning for both conditions, a second eight-execution study passed: candidate and baseline each repaired both applicable trials and preserved the already-correct configuration twice. All outputs met the interface and preserved independent work. The function study accepted the candidate for those local cases; production admission was not requested.\u003c/p>\n\u003cp>The \u003ca href=\"https://github.com/TheodoreGalanos/ribosome/blob/main/examples/offline-lab/behavior-results.md\">behavior results\u003c/a> include both attempts, the instruction, source excerpts, owner interventions, case outputs and costs. This demonstrates local function with no measured advantage over baseline. The same follow-up found the earlier path candidate through bounded lexical query reformulation.\u003c/p>\n\u003ch2 id=\"earlier-r7-live-trials\">Earlier R7 live trials\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Trial\u003c/th>\n\u003cth>Observed result\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Long-task continuation\u003c/td>\n\u003ctd>Restart, source withdrawal, and compaction mechanisms worked; the long live task still failed useful delivery.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Discovery\u003c/td>\n\u003ctd>The curator saved definitions and investigations, but grounded occurrence delivery remained incomplete.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Prepared transfer\u003c/td>\n\u003ctd>A recipient attempted an agent-authored policy with fresh receipts; the trial exhausted its allowance with an incorrect result.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Whole-agent comparison\u003c/td>\n\u003ctd>Of four cases per arm, baseline, retry, and critique each succeeded on three; care and candidate each succeeded on two. The study remained inconclusive.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Installed learning example\u003c/td>\n\u003ctd>Discovery saved an inconclusive investigation after seven calls. Extraction and the four planned recipient evaluations remained unexecuted because there was no candidate.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>The whole-agent recheck used 20 planned cases and 36 Pi stages. Seventeen cases completed and three exhausted their local allowance. These were small, authored development cases with one repetition. The result supports further investigation; general learned transfer and a benefit over the controls remain open evaluation questions.\u003c/p>\n\u003ch2 id=\"use-it-in-an-application\">Use it in an application\u003c/h2>\n\u003cp>Begin with observations on real artifacts and checks that express your task&#39;s requirements. Add scoped repair where your application coordinates the relevant writers. Evaluate each prepared behavior in the context where you intend to use it.\u003c/p>\n\u003cp>The local tool adapter runs trusted host commands in working copies. Use a suitably isolated executor for untrusted code. For interruption, backup, and source cleanup procedures, see \u003ca href=\"#reference/operations\">Operations\u003c/a>.\u003c/p>\n","text":"\n# Current support\n\nRibosome is an early-stage local library. The R1–R7 implementation is complete and available from source. Its automated checks and live trials answer different questions: whether the library carries out the work correctly, and whether a model produces useful behavior on the supplied tasks.\n\n## Available now\n\n| Area | Current capability |\n| --- | --- |\n| Attachment | Pi and generic connectors, startup or mid-run observation, feedback, and optional steering. |\n| Repair and recovery | Cooperative writes, required checks, recorded action outcomes, and owner settlement for uncertain effects. |\n| Runtime | Saved continuations, queued child work, responsive state operations, and shared resource accounting. |\n| Memory | Scoped records, source-aware context, withdrawal, and ranked text retrieval. |\n| Discovery | Bounded evidence investigation, functional definitions, grounded occurrences, and contrast work. |\n| Prepared behavior | Pi execution of selected instructions on recipient inputs, with capabilities and admission checks. |\n| Laboratory | Isolated agent cases, five-arm system comparisons, protected judging, and contextual admission. |\n\n## Observed checks\n\nThe recorded R7 handoff passed 15 focused mechanical check groups and 22 installed-consumer checks. These covered the packaged TypeScript worker and installed Rust executable, attachment and recovery, prepared invocation, fresh checks, and appropriate abstention. Provider fixtures exercised those mechanisms without paid calls.\n\nThe combined recovery check applied a repair, interrupted its bookkeeping, resumed with one recorded application, restored the target through a fresh check, and left unchecked downstream work stale. It also verified that retired memory was excluded from the next provider context.\n\nThese are recorded implementation checks. See the [validation report](../../validation.md#r7-integrated-qualification-and-handoff) and [sanitized evidence snapshot](../../qualification/evidence.json) for their source state and results.\n\nThe [instruction lifecycle example](../../../examples/learned-behavior/README.md#revise-and-reuse-a-known-instruction) connects revision, evaluation, admission, memory, retrieval and execution in one check. A faulty row-reconciliation rule fails a case, a revised rule passes both cases, and a later agent uses it while preserving independent work. A units counterexample then triggers withdrawal. The check confirms that the instruction and its linked memory leave retrieval and that Rust refuses another production invocation. Provider responses are authored; Pi execution and Rust state changes are real.\n\nThe external-trajectory campaign also exposed a contrast access bug: checks on a definition's supporting files blocked its delivery and later cleared the reviewer's context. The corrected path checks source availability while keeping donor files outside the review assignment. A regression now covers reading, retrieval, continued context and withdrawal. The live rerun completed with one context segment and saved a rejected match against the inspected GeoPandas excerpts. The [external-data pilot](../../../examples/offline-lab/expanded-results.md) is closed, with its broader system comparison deferred after a negative function result.\n\n## External-data development pilot\n\nThe external-data pilot completed discovery, extraction and eight fresh task executions. The candidate preserved an already correct incompatible result but failed both applicable path-resolution trials. It was not admitted, and the broader system comparison was deferred.\n\n| Stage | Observed result |\n| --- | --- |\n| Import | Twelve AEC-Bench and Nebius episodes acquired and used in development investigations. |\n| Discovery and extraction | A definition, occurrence, investigation and instruction describing an EDK2 domain procedure. |\n| Contrast | Rejected a match against two inspected GeoPandas excerpts. |\n| Applicable task | Baseline 0/2; candidate 0/2. Both candidate trials failed path resolution. |\n| Incompatible task | Baseline 1/2; candidate 2/2. Both candidate trials preserved the correct output. |\n\nThe [candidate and case outputs](../../../examples/offline-lab/expanded-results.md#what-the-candidate-carried-forward) make the instruction and its failures inspectable. This small development study supports analysis of those cases; broader transfer remains an open question.\n\n## Agent-strategy follow-up\n\nA later investigation used a numpydoc execution to identify an agent strategy: inspect a warning's route and actual wrapper metadata, adapt a contradicted assumption, then check the contextual and context-free cases. Discovery, a nearby contrast and extraction completed after an interrupted attempt and owner-scheduled continuation.\n\nThe first eight configuration-task executions exposed an ambiguous field meaning in the recipient contract. After clarifying that meaning for both conditions, a second eight-execution study passed: candidate and baseline each repaired both applicable trials and preserved the already-correct configuration twice. All outputs met the interface and preserved independent work. The function study accepted the candidate for those local cases; production admission was not requested.\n\nThe [behavior results](../../../examples/offline-lab/behavior-results.md) include both attempts, the instruction, source excerpts, owner interventions, case outputs and costs. This demonstrates local function with no measured advantage over baseline. The same follow-up found the earlier path candidate through bounded lexical query reformulation.\n\n## Earlier R7 live trials\n\n| Trial | Observed result |\n| --- | --- |\n| Long-task continuation | Restart, source withdrawal, and compaction mechanisms worked; the long live task still failed useful delivery. |\n| Discovery | The curator saved definitions and investigations, but grounded occurrence delivery remained incomplete. |\n| Prepared transfer | A recipient attempted an agent-authored policy with fresh receipts; the trial exhausted its allowance with an incorrect result. |\n| Whole-agent comparison | Of four cases per arm, baseline, retry, and critique each succeeded on three; care and candidate each succeeded on two. The study remained inconclusive. |\n| Installed learning example | Discovery saved an inconclusive investigation after seven calls. Extraction and the four planned recipient evaluations remained unexecuted because there was no candidate. |\n\nThe whole-agent recheck used 20 planned cases and 36 Pi stages. Seventeen cases completed and three exhausted their local allowance. These were small, authored development cases with one repetition. The result supports further investigation; general learned transfer and a benefit over the controls remain open evaluation questions.\n\n## Use it in an application\n\nBegin with observations on real artifacts and checks that express your task's requirements. Add scoped repair where your application coordinates the relevant writers. Evaluate each prepared behavior in the context where you intend to use it.\n\nThe local tool adapter runs trusted host commands in working copies. Use a suitably isolated executor for untrusted code. For interruption, backup, and source cleanup procedures, see [Operations](../reference/operations.md).\n","headings":[{"level":"h2","id":"available-now","text":"Available now"},{"level":"h2","id":"observed-checks","text":"Observed checks"},{"level":"h2","id":"external-data-development-pilot","text":"External-data development pilot"},{"level":"h2","id":"agent-strategy-follow-up","text":"Agent-strategy follow-up"},{"level":"h2","id":"earlier-r7-live-trials","text":"Earlier R7 live trials"},{"level":"h2","id":"use-it-in-an-application","text":"Use it in an application"}],"source":"https://github.com/TheodoreGalanos/ribosome/blob/main/docs/content/evaluation/support.md"},{"slug":"reference/configuration","title":"Configuration","description":"Configure the model, workspace, permissions, checks, and studies.","group":"Reference","html":"\u003ch1 id=\"configuration\">Configuration\u003c/h1>\n\u003cp>The host reads a JSON configuration. Keep provider credentials in the environment and commit only non-secret settings.\u003c/p>\n\u003ch2 id=\"create-a-starting-file\">Create a starting file\u003c/h2>\n\u003cp>From a built checkout:\u003c/p>\n\u003cdiv class=\"code-block\">\u003cdiv class=\"code-top\">\u003cspan>sh\u003c/span>\u003cbutton class=\"copy\" aria-label=\"Copy code\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode>target/debug/ribosome init /absolute/path/to/workspace\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>This creates \u003ccode>ribosome.json\u003c/code> in the chosen directory. It starts in \u003ccode>observe\u003c/code> mode with empty artifact and tool permissions and a placeholder model. Edit the file before running it.\u003c/p>\n\u003cp>Set the workspace and state paths, choose the provider and model, and replace the prompt with the maintenance task. Grant access to the evidence and tools that task needs. The generated grant has a one-hour deadline; issue a fresh work identity and grant when starting new work after it expires.\u003c/p>\n\u003ch2 id=\"host-settings\">Host settings\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Field\u003c/th>\n\u003cth>Purpose\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>workspace\u003c/code>, \u003ccode>state_dir\u003c/code>\u003c/td>\n\u003ctd>Task files and local Ribosome state.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>node\u003c/code>, \u003ccode>worker\u003c/code>\u003c/td>\n\u003ctd>Node executable and Pi-worker paths.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>request\u003c/code>\u003c/td>\n\u003ctd>Run identity, profile, operator, prompt, provider, and model.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>grant\u003c/code>\u003c/td>\n\u003ctd>Client/project scope, access mode, permitted paths/tools, and budget.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>run_budget\u003c/code>\u003c/td>\n\u003ctd>Optional smaller allowance for this run, charged under the existing root grant.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>model_max_output_tokens\u003c/code>\u003c/td>\n\u003ctd>Output allowance per model response, including continuation summaries. Defaults to 4,096; accepts up to 32,768 and respects the model&#39;s own limit.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>tools\u003c/code>\u003c/td>\n\u003ctd>Registered commands and the files they read, write, or validate.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>attachment\u003c/code>\u003c/td>\n\u003ctd>Event kinds, batching, feedback expiry, and optional steering or coordinated writes.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>corpora\u003c/code>\u003c/td>\n\u003ctd>Selected source evidence for curator investigations or caretaker proofreading; choose one with \u003ccode>request.discovery_corpus\u003c/code>.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>evaluators\u003c/code>, \u003ccode>agent_evaluators\u003c/code>\u003c/td>\n\u003ctd>Command evaluators or complete Pi-agent evaluation setups.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>cases\u003c/code>, \u003ccode>policies\u003c/code>\u003c/td>\n\u003ctd>Host-owned cases and experiment acceptance rules.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Use absolute executable paths. An installed consumer must resolve the worker from its installed package; see \u003ca href=\"#start/installation\">Installation\u003c/a>.\u003c/p>\n\u003ch2 id=\"provider-settings\">Provider settings\u003c/h2>\n\u003cp>The example scripts load \u003ccode>.env\u003c/code>; existing shell settings take precedence. For direct Rust commands, export provider credentials in the shell before starting the host.\u003c/p>\n\u003cp>Set \u003ccode>RIBOSOME_PROVIDER\u003c/code> and \u003ccode>RIBOSOME_MODEL\u003c/code> for the example scripts. In host JSON, use \u003ccode>request.provider\u003c/code> and \u003ccode>request.model\u003c/code>. The model identifies an entry in the pinned Pi catalogue.\u003c/p>\n\u003cp>OpenAI, Anthropic, and Azure OpenAI Responses use the environment keys documented in \u003ca href=\"https://github.com/TheodoreGalanos/ribosome/blob/main/.env.example\">\u003ccode>.env.example\u003c/code>\u003c/a>. Azure also maps the catalogue model to your local deployment. Keep deployment names and endpoint settings in your private environment.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cdiv class=\"code-top\">\u003cspan>sh\u003c/span>\u003cbutton class=\"copy\" aria-label=\"Copy code\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode>npm run provider:check\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>This validates the presence of required provider settings without making a model call.\u003c/p>\n\u003ch2 id=\"permissions-and-budgets\">Permissions and budgets\u003c/h2>\n\u003cp>\u003ccode>grant.paths\u003c/code> permits reads. \u003ccode>writable_paths\u003c/code> restricts writes; omitting it uses \u003ccode>paths\u003c/code> for both. \u003ccode>required_checks\u003c/code> names checks the host must run before applying a proposed change.\u003c/p>\n\u003cp>Budgets cover model calls, tokens, local cost accounting, actions, follow-up work, and deadlines. Child runs, compaction, and metered studies share their parent&#39;s allowance. An unknown dispatched call keeps its reservation until its usage can be resolved. \u003ca href=\"#guides/runtime\">Runtime and storage\u003c/a> explains scheduling and external-agent accounting.\u003c/p>\n\u003cp>Set \u003ccode>run_budget\u003c/code> to a complete \u003ccode>Budget\u003c/code> when one run needs a smaller cap. It creates a child allocation under the grant; other work still shares the root ceiling. Reuse the unchanged config when resuming an interrupted run. Choose either \u003ccode>run_budget\u003c/code> or \u003ccode>request.parent_allocation_id\u003c/code> for a request.\u003c/p>\n\u003cp>For full field shapes, read the \u003ca href=\"https://github.com/TheodoreGalanos/ribosome/blob/main/contracts/schema.json\">canonical schema\u003c/a>, \u003ca href=\"https://github.com/TheodoreGalanos/ribosome/blob/main/crates/ribosome-cli/src/main.rs\">CLI configuration\u003c/a>, and \u003ca href=\"https://github.com/TheodoreGalanos/ribosome/blob/main/docs/protocol.md\">protocol reference\u003c/a>.\u003c/p>\n","text":"\n# Configuration\n\nThe host reads a JSON configuration. Keep provider credentials in the environment and commit only non-secret settings.\n\n## Create a starting file\n\nFrom a built checkout:\n\n```sh\ntarget/debug/ribosome init /absolute/path/to/workspace\n```\n\nThis creates `ribosome.json` in the chosen directory. It starts in `observe` mode with empty artifact and tool permissions and a placeholder model. Edit the file before running it.\n\nSet the workspace and state paths, choose the provider and model, and replace the prompt with the maintenance task. Grant access to the evidence and tools that task needs. The generated grant has a one-hour deadline; issue a fresh work identity and grant when starting new work after it expires.\n\n## Host settings\n\n| Field | Purpose |\n| --- | --- |\n| `workspace`, `state_dir` | Task files and local Ribosome state. |\n| `node`, `worker` | Node executable and Pi-worker paths. |\n| `request` | Run identity, profile, operator, prompt, provider, and model. |\n| `grant` | Client/project scope, access mode, permitted paths/tools, and budget. |\n| `run_budget` | Optional smaller allowance for this run, charged under the existing root grant. |\n| `model_max_output_tokens` | Output allowance per model response, including continuation summaries. Defaults to 4,096; accepts up to 32,768 and respects the model's own limit. |\n| `tools` | Registered commands and the files they read, write, or validate. |\n| `attachment` | Event kinds, batching, feedback expiry, and optional steering or coordinated writes. |\n| `corpora` | Selected source evidence for curator investigations or caretaker proofreading; choose one with `request.discovery_corpus`. |\n| `evaluators`, `agent_evaluators` | Command evaluators or complete Pi-agent evaluation setups. |\n| `cases`, `policies` | Host-owned cases and experiment acceptance rules. |\n\nUse absolute executable paths. An installed consumer must resolve the worker from its installed package; see [Installation](../start/installation.md).\n\n## Provider settings\n\nThe example scripts load `.env`; existing shell settings take precedence. For direct Rust commands, export provider credentials in the shell before starting the host.\n\nSet `RIBOSOME_PROVIDER` and `RIBOSOME_MODEL` for the example scripts. In host JSON, use `request.provider` and `request.model`. The model identifies an entry in the pinned Pi catalogue.\n\nOpenAI, Anthropic, and Azure OpenAI Responses use the environment keys documented in [`.env.example`](../../../.env.example). Azure also maps the catalogue model to your local deployment. Keep deployment names and endpoint settings in your private environment.\n\n```sh\nnpm run provider:check\n```\n\nThis validates the presence of required provider settings without making a model call.\n\n## Permissions and budgets\n\n`grant.paths` permits reads. `writable_paths` restricts writes; omitting it uses `paths` for both. `required_checks` names checks the host must run before applying a proposed change.\n\nBudgets cover model calls, tokens, local cost accounting, actions, follow-up work, and deadlines. Child runs, compaction, and metered studies share their parent's allowance. An unknown dispatched call keeps its reservation until its usage can be resolved. [Runtime and storage](../guides/runtime.md) explains scheduling and external-agent accounting.\n\nSet `run_budget` to a complete `Budget` when one run needs a smaller cap. It creates a child allocation under the grant; other work still shares the root ceiling. Reuse the unchanged config when resuming an interrupted run. Choose either `run_budget` or `request.parent_allocation_id` for a request.\n\nFor full field shapes, read the [canonical schema](../../../contracts/schema.json), [CLI configuration](../../../crates/ribosome-cli/src/main.rs), and [protocol reference](../../protocol.md).\n","headings":[{"level":"h2","id":"create-a-starting-file","text":"Create a starting file"},{"level":"h2","id":"host-settings","text":"Host settings"},{"level":"h2","id":"provider-settings","text":"Provider settings"},{"level":"h2","id":"permissions-and-budgets","text":"Permissions and budgets"}],"source":"https://github.com/TheodoreGalanos/ribosome/blob/main/docs/content/reference/configuration.md"},{"slug":"reference/operations","title":"Operations","description":"Run, inspect, stop, recover, and back up the local host.","group":"Reference","html":"\u003ch1 id=\"operations\">Operations\u003c/h1>\n\u003cp>Your application owns the Rust host&#39;s lifetime. Use one host owner per workspace, and keep the Rust executable and TypeScript worker on matching builds.\u003c/p>\n\u003ch2 id=\"common-commands\">Common commands\u003c/h2>\n\u003cp>From a checkout, use \u003ccode>target/debug/ribosome\u003c/code>. After installation, use your installed executable.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Command\u003c/th>\n\u003cth>Purpose\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>ribosome run CONFIG.json\u003c/code>\u003c/td>\n\u003ctd>Run maintenance and permitted follow-up work.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>ribosome host CONFIG.json\u003c/code>\u003c/td>\n\u003ctd>Serve an application attachment over stdin/stdout.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>ribosome study CONFIG.json EXPERIMENT_ID\u003c/code>\u003c/td>\n\u003ctd>Execute a saved host-owned study.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>ribosome inspect DATABASE RUN_ID\u003c/code>\u003c/td>\n\u003ctd>Read status, effects, continuation metadata, timing, and usage.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>ribosome effect CONFIG.json OPERATION_ID\u003c/code>\u003c/td>\n\u003ctd>Inspect an uncertain effect and current workspace versions.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>ribosome settle CONFIG.json SETTLEMENT.json\u003c/code>\u003c/td>\n\u003ctd>Record an owner&#39;s inspected decision about an unknown outcome.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>ribosome search CONFIG.json QUERY.json\u003c/code>\u003c/td>\n\u003ctd>Query records within the configured grant.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>ribosome validate CONTRACT VALUE.json\u003c/code>\u003c/td>\n\u003ctd>Validate a value against a named contract.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Run \u003ccode>ribosome --help\u003c/code> for all commands. Direct model execution uses provider settings exported in the shell.\u003c/p>\n\u003ch2 id=\"stop-and-inspect\">Stop and inspect\u003c/h2>\n\u003cp>Ctrl-C requests cancellation. Already-dispatched work must settle before the host releases its execution ownership.\u003c/p>\n\u003cdiv class=\"code-block\">\u003cdiv class=\"code-top\">\u003cspan>sh\u003c/span>\u003cbutton class=\"copy\" aria-label=\"Copy code\">Copy\u003c/button>\u003c/div>\u003cpre>\u003ccode>target/debug/ribosome inspect /absolute/state/ribosome.db RUN_ID\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>Read \u003ccode>budget\u003c/code>, \u003ccode>model_usage\u003c/code>, and \u003ccode>timings\u003c/code> alongside run status. Unknown usage represents a retained liability. Timing spans describe the measured operations and can overlap.\u003c/p>\n\u003cp>For attachments, \u003ccode>finish()\u003c/code> flushes observations and waits for maintenance and feedback. \u003ccode>detach()\u003c/code> unsubscribes and requests cancellation of attachment maintenance while the application&#39;s agent continues. \u003ccode>client.close()\u003c/code> also closes a host it started.\u003c/p>\n\u003ch2 id=\"resume-an-interrupted-run\">Resume an interrupted run\u003c/h2>\n\u003cp>Repeat the interrupted run&#39;s unchanged configuration while its grant remains valid. Ribosome restores available source context and reconciles recorded effects. A captured action outcome can finish bookkeeping without repeating the action.\u003c/p>\n\u003cp>For an unknown outcome, keep competing writers stopped. Establish that the original executor has stopped, then use \u003ccode>ribosome effect\u003c/code> to inspect its receipt and all possibly affected files. Submit the returned versions and your reason with \u003ccode>ribosome settle\u003c/code>. Run fresh authorized checks to establish what is valid now.\u003c/p>\n\u003cp>The \u003ca href=\"https://github.com/TheodoreGalanos/ribosome/blob/main/docs/operations.md#settle-an-executor-with-an-unknown-outcome\">settlement reference\u003c/a> gives the JSON shape. For cooperative repair, reconcile the original writer handoff after all unknown effects are settled. Start a terminal run&#39;s next task with a new work identity.\u003c/p>\n\u003ch2 id=\"back-up-and-upgrade\">Back up and upgrade\u003c/h2>\n\u003cp>For an operational backup, stop the host and external writers, let effects settle, and copy the workspace, full state directory, and non-secret configuration. This includes the SQLite database and its related files, branches, and exports.\u003c/p>\n\u003cp>The current database schema is 21. Opening an older supported schema creates a consistent database backup before a transactional migration. Keep that backup and use the matching current binary after migration.\u003c/p>\n\u003cp>Restore into an inspection location first. Check artifact versions and unresolved effects before resuming. Saved branch paths are absolute, so preserve their locations when restoring a run.\u003c/p>\n\u003ch2 id=\"maintain-stored-sources\">Maintain stored sources\u003c/h2>\n\u003cp>Retirement immediately removes source access. Deletion also queues cleanup of managed copies. Library hosts can inspect progress with \u003ccode>Store::source_cleanup_status\u003c/code> and advance pending jobs with \u003ccode>Store::cleanup_sources\u003c/code> after restart.\u003c/p>\n\u003cp>See the \u003ca href=\"https://github.com/TheodoreGalanos/ribosome/blob/main/docs/operations.md\">operations reference\u003c/a> for pagination, SQLite backup, search-index rebuilding, and failure recovery details. \u003ca href=\"#guides/runtime\">Runtime and storage\u003c/a> shows the directory structure.\u003c/p>\n","text":"\n# Operations\n\nYour application owns the Rust host's lifetime. Use one host owner per workspace, and keep the Rust executable and TypeScript worker on matching builds.\n\n## Common commands\n\nFrom a checkout, use `target/debug/ribosome`. After installation, use your installed executable.\n\n| Command | Purpose |\n| --- | --- |\n| `ribosome run CONFIG.json` | Run maintenance and permitted follow-up work. |\n| `ribosome host CONFIG.json` | Serve an application attachment over stdin/stdout. |\n| `ribosome study CONFIG.json EXPERIMENT_ID` | Execute a saved host-owned study. |\n| `ribosome inspect DATABASE RUN_ID` | Read status, effects, continuation metadata, timing, and usage. |\n| `ribosome effect CONFIG.json OPERATION_ID` | Inspect an uncertain effect and current workspace versions. |\n| `ribosome settle CONFIG.json SETTLEMENT.json` | Record an owner's inspected decision about an unknown outcome. |\n| `ribosome search CONFIG.json QUERY.json` | Query records within the configured grant. |\n| `ribosome validate CONTRACT VALUE.json` | Validate a value against a named contract. |\n\nRun `ribosome --help` for all commands. Direct model execution uses provider settings exported in the shell.\n\n## Stop and inspect\n\nCtrl-C requests cancellation. Already-dispatched work must settle before the host releases its execution ownership.\n\n```sh\ntarget/debug/ribosome inspect /absolute/state/ribosome.db RUN_ID\n```\n\nRead `budget`, `model_usage`, and `timings` alongside run status. Unknown usage represents a retained liability. Timing spans describe the measured operations and can overlap.\n\nFor attachments, `finish()` flushes observations and waits for maintenance and feedback. `detach()` unsubscribes and requests cancellation of attachment maintenance while the application's agent continues. `client.close()` also closes a host it started.\n\n## Resume an interrupted run\n\nRepeat the interrupted run's unchanged configuration while its grant remains valid. Ribosome restores available source context and reconciles recorded effects. A captured action outcome can finish bookkeeping without repeating the action.\n\nFor an unknown outcome, keep competing writers stopped. Establish that the original executor has stopped, then use `ribosome effect` to inspect its receipt and all possibly affected files. Submit the returned versions and your reason with `ribosome settle`. Run fresh authorized checks to establish what is valid now.\n\nThe [settlement reference](../../operations.md#settle-an-executor-with-an-unknown-outcome) gives the JSON shape. For cooperative repair, reconcile the original writer handoff after all unknown effects are settled. Start a terminal run's next task with a new work identity.\n\n## Back up and upgrade\n\nFor an operational backup, stop the host and external writers, let effects settle, and copy the workspace, full state directory, and non-secret configuration. This includes the SQLite database and its related files, branches, and exports.\n\nThe current database schema is 21. Opening an older supported schema creates a consistent database backup before a transactional migration. Keep that backup and use the matching current binary after migration.\n\nRestore into an inspection location first. Check artifact versions and unresolved effects before resuming. Saved branch paths are absolute, so preserve their locations when restoring a run.\n\n## Maintain stored sources\n\nRetirement immediately removes source access. Deletion also queues cleanup of managed copies. Library hosts can inspect progress with `Store::source_cleanup_status` and advance pending jobs with `Store::cleanup_sources` after restart.\n\nSee the [operations reference](../../operations.md) for pagination, SQLite backup, search-index rebuilding, and failure recovery details. [Runtime and storage](../guides/runtime.md) shows the directory structure.\n","headings":[{"level":"h2","id":"common-commands","text":"Common commands"},{"level":"h2","id":"stop-and-inspect","text":"Stop and inspect"},{"level":"h2","id":"resume-an-interrupted-run","text":"Resume an interrupted run"},{"level":"h2","id":"back-up-and-upgrade","text":"Back up and upgrade"},{"level":"h2","id":"maintain-stored-sources","text":"Maintain stored sources"}],"source":"https://github.com/TheodoreGalanos/ribosome/blob/main/docs/content/reference/operations.md"},{"slug":"reference/further-reading","title":"Detailed references","description":"Contracts, connector details, operating procedures, and validation evidence.","group":"Reference","html":"\u003ch1 id=\"detailed-references\">Detailed references\u003c/h1>\n\u003cp>Use these repository documents when implementing an adapter, operating stored state, or reviewing the evidence behind a capability.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Document\u003c/th>\n\u003cth>What it contains\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ca href=\"https://github.com/TheodoreGalanos/ribosome/blob/main/docs/attachments.md\">Connector reference\u003c/a>\u003c/td>\n\u003ctd>Pi and generic events, feedback delivery, steering, and coordinated repair.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"https://github.com/TheodoreGalanos/ribosome/blob/main/docs/protocol.md\">Protocol\u003c/a>\u003c/td>\n\u003ctd>Worker and host interfaces, source-aware context, resource accounting, prepared invocation, and laboratory contracts.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"https://github.com/TheodoreGalanos/ribosome/blob/main/docs/operations.md\">Operations reference\u003c/a>\u003c/td>\n\u003ctd>Detailed inspection, settlement, backup, migration, and cleanup procedures.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"https://github.com/TheodoreGalanos/ribosome/blob/main/docs/validation.md\">Validation\u003c/a>\u003c/td>\n\u003ctd>Recorded automated checks and live trials, including incomplete outcomes.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"https://github.com/TheodoreGalanos/ribosome/blob/main/docs/qualification/evidence.json\">Qualification evidence\u003c/a>\u003c/td>\n\u003ctd>Sanitized machine-readable snapshot of the R7 handoff and R6 development recheck.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"https://github.com/TheodoreGalanos/ribosome/blob/main/contracts/schema.json\">Canonical schema\u003c/a>\u003c/td>\n\u003ctd>Shared data contracts and method shapes.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"examples\">Examples\u003c/h2>\n\u003cp>The \u003ca href=\"https://github.com/TheodoreGalanos/ribosome/blob/main/examples/attached-agent/demo.mjs\">attached-agent driver\u003c/a> demonstrates startup or mid-run observation and checked repair. The \u003ca href=\"https://github.com/TheodoreGalanos/ribosome/blob/main/examples/learned-behavior/README.md\">learning example\u003c/a> prepares discovery evidence and attempts extraction and recipient evaluation from an installed consumer.\u003c/p>\n\u003cp>\u003ca href=\"https://github.com/TheodoreGalanos/ribosome/blob/main/tests/evaluations/README.md\">Evaluation cases\u003c/a> describe the repository&#39;s other runnable development tasks and their acceptance checks. Live examples use the configured model provider and retain their reports locally.\u003c/p>\n\u003ch2 id=\"design-and-implementation-plans\">Design and implementation plans\u003c/h2>\n\u003cp>The \u003ca href=\"https://github.com/TheodoreGalanos/ribosome/blob/main/docs/specification.md\">design specification\u003c/a> records the design&#39;s rationale and intended scope. The \u003ca href=\"https://github.com/TheodoreGalanos/ribosome/blob/main/docs/plans/reliable-behavioral-learning/README.md\">R1–R7 implementation plan\u003c/a> links each increment to its requirements and acceptance evidence. Use the guides and validation report for current behavior and observed results.\u003c/p>\n","text":"\n# Detailed references\n\nUse these repository documents when implementing an adapter, operating stored state, or reviewing the evidence behind a capability.\n\n| Document | What it contains |\n| --- | --- |\n| [Connector reference](../../attachments.md) | Pi and generic events, feedback delivery, steering, and coordinated repair. |\n| [Protocol](../../protocol.md) | Worker and host interfaces, source-aware context, resource accounting, prepared invocation, and laboratory contracts. |\n| [Operations reference](../../operations.md) | Detailed inspection, settlement, backup, migration, and cleanup procedures. |\n| [Validation](../../validation.md) | Recorded automated checks and live trials, including incomplete outcomes. |\n| [Qualification evidence](../../qualification/evidence.json) | Sanitized machine-readable snapshot of the R7 handoff and R6 development recheck. |\n| [Canonical schema](../../../contracts/schema.json) | Shared data contracts and method shapes. |\n\n## Examples\n\nThe [attached-agent driver](../../../examples/attached-agent/demo.mjs) demonstrates startup or mid-run observation and checked repair. The [learning example](../../../examples/learned-behavior/README.md) prepares discovery evidence and attempts extraction and recipient evaluation from an installed consumer.\n\n[Evaluation cases](../../../tests/evaluations/README.md) describe the repository's other runnable development tasks and their acceptance checks. Live examples use the configured model provider and retain their reports locally.\n\n## Design and implementation plans\n\nThe [design specification](../../specification.md) records the design's rationale and intended scope. The [R1–R7 implementation plan](../../plans/reliable-behavioral-learning/README.md) links each increment to its requirements and acceptance evidence. Use the guides and validation report for current behavior and observed results.\n","headings":[{"level":"h2","id":"examples","text":"Examples"},{"level":"h2","id":"design-and-implementation-plans","text":"Design and implementation plans"}],"source":"https://github.com/TheodoreGalanos/ribosome/blob/main/docs/content/reference/further-reading.md"}];
const groups = [{"title":"Start","pages":["index","start/quickstart","start/installation"]},{"title":"Core","pages":["core/how-it-works","core/inspiration","core/motifs"]},{"title":"Guides","pages":["guides/connect","guides/runtime","guides/repair","guides/discovery","guides/reuse","guides/memory"]},{"title":"Evaluation","pages":["evaluation/experiments","evaluation/external-records","evaluation/support"]},{"title":"Reference","pages":["reference/configuration","reference/operations","reference/further-reading"]}];
const nav = document.getElementById('sidebar');
const main = document.querySelector('main');
const article = document.getElementById('article');
const toc = document.getElementById('toc');
const dialog = document.getElementById('search');
const input = document.getElementById('query');
const results = document.getElementById('results');
const menu = document.getElementById('menu');
const esc = text => String(text).replace(/[&<>"']/g, char => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
})[char]);

nav.innerHTML = groups.map(group => `<div class="nav-group"><h2>${esc(group.title)}</h2>${
  group.pages.map(slug => {
    const page = pages.find(page => page.slug === slug);
    return `<a href="#${slug}" data-page="${slug}">${esc(page.title)}</a>`;
  }).join('')
}</div>`).join('') + '<div class="sidebar-foot">TypeScript / Pi + Rust<br>Local state · source installation</div>';

let lastPage = '';
function closeNavigation() {
  nav.classList.remove('open');
  menu.setAttribute('aria-expanded', 'false');
}

function route() {
  const [slug, anchor] = (location.hash.slice(1) || 'index').split('~');
  const page = pages.find(page => page.slug === slug);
  if (!page) {
    article.innerHTML = '<h1>Page not found</h1><p><a href="#index">Return to the introduction</a> or search the documentation.</p>';
    toc.innerHTML = '';
    document.getElementById('paging').innerHTML = '';
    document.getElementById('source-note').innerHTML = '';
    document.getElementById('eyebrow').textContent = 'Documentation';
    document.title = 'Page not found · Ribosome docs';
    nav.querySelectorAll('a').forEach(link => {
      link.classList.remove('active');
      link.removeAttribute('aria-current');
    });
    lastPage = '';
    closeNavigation();
    return;
  }
  const changed = lastPage !== page.slug;
  lastPage = page.slug;
  document.title = `${page.title} · Ribosome docs`;
  document.getElementById('eyebrow').textContent = `${page.group} / ${page.title}`;
  article.innerHTML = page.html;
  nav.querySelectorAll('a').forEach(link => {
    const active = link.dataset.page === page.slug;
    link.classList.toggle('active', active);
    if (active) link.setAttribute('aria-current', 'page');
    else link.removeAttribute('aria-current');
  });
  toc.innerHTML = '<h2>On this page</h2>' + page.headings.map(heading =>
    `<a href="#${page.slug}~${heading.id}" class="${heading.level === 'h3' ? 'sub' : ''}">${esc(heading.text)}</a>`
  ).join('');
  const index = pages.indexOf(page);
  document.getElementById('paging').innerHTML = (index > 0
    ? `<a href="#${pages[index - 1].slug}"><span>Previous</span>← ${esc(pages[index - 1].title)}</a>` : '') +
    (index < pages.length - 1
      ? `<a class="next" href="#${pages[index + 1].slug}"><span>Next</span>${esc(pages[index + 1].title)} →</a>` : '');
  document.getElementById('source-note').innerHTML = `<a href="${page.source}">Edit this page on GitHub ↗</a>`;
  closeNavigation();
  if (anchor) requestAnimationFrame(() => document.getElementById(anchor)?.scrollIntoView({ behavior: 'instant' }));
  else if (changed) window.scrollTo({ top: 0, behavior: 'instant' });
  article.querySelectorAll('.copy').forEach(button => {
    button.onclick = async () => {
      const text = button.closest('.code-block').querySelector('code').textContent;
      try {
        await navigator.clipboard.writeText(text);
        button.textContent = 'Copied';
      } catch {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        const copied = document.execCommand('copy');
        textarea.remove();
        button.textContent = copied ? 'Copied' : 'Select code';
      }
      setTimeout(() => { button.textContent = 'Copy'; }, 1300);
    };
  });
}

function search() {
  const terms = input.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const matches = pages.map(page => {
    const title = `${page.title} ${page.description}`.toLowerCase();
    const body = page.text.toLowerCase();
    const score = terms.reduce((score, term) => score + (title.includes(term) ? 6 : 0) + (body.includes(term) ? 1 : 0), 0);
    return { page, score, match: terms.every(term => title.includes(term) || body.includes(term)) };
  }).filter(result => result.match).sort((a, b) => b.score - a.score).slice(0, 12);
  results.innerHTML = matches.length ? matches.map(({ page }) =>
    `<a class="search-result" href="#${page.slug}"><strong>${esc(page.title)}</strong><small>${esc(page.group)} · ${esc(page.description)}</small></a>`
  ).join('') : '<div class="empty">No matching pages. Try “repair”, “memory”, or “provider”.</div>';
  results.querySelectorAll('a').forEach(link => { link.onclick = () => dialog.close(); });
}

function openSearch() {
  dialog.showModal();
  input.value = '';
  search();
  input.focus();
}

document.getElementById('search-toggle').onclick = openSearch;
document.getElementById('close-search').onclick = () => dialog.close();
input.addEventListener('input', search);
input.addEventListener('keydown', event => {
  if (event.key === 'Enter') {
    const first = results.querySelector('a');
    if (first) { location.hash = first.hash; dialog.close(); }
  } else if (event.key === 'ArrowDown') {
    event.preventDefault();
    results.querySelector('a')?.focus();
  }
});
dialog.addEventListener('click', event => { if (event.target === dialog) dialog.close(); });
document.addEventListener('keydown', event => {
  if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'k') {
    event.preventDefault();
    if (dialog.open) dialog.close();
    else openSearch();
  }
  if (event.key === 'Escape') closeNavigation();
});
menu.onclick = () => menu.setAttribute('aria-expanded', String(nav.classList.toggle('open')));
nav.addEventListener('click', event => { if (event.target.closest('a')) closeNavigation(); });
document.querySelector('.skip').addEventListener('click', event => {
  event.preventDefault();
  main.focus();
  main.scrollIntoView();
});
window.addEventListener('hashchange', route);
route();

</script></body></html>
