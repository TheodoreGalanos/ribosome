[workspace]
members = ["crates/ribosome-core", "crates/ribosome-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
tokio = { version = "=1.49.0", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "sync", "time", "signal"] }
rusqlite = { version = "=0.38.0", features = ["bundled"] }
uuid = { version = "=1.20.0", features = ["v7", "serde"] }
sha2 = "=0.10.9"
jsonschema = { version = "=0.41.0", default-features = false }
thiserror = "=2.0.18"
tempfile = "=3.24.0"
libc = "=0.2.189"
